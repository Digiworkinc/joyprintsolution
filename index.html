        extend: {

  <style>
    @media print {
      body * {
        visibility: hidden;
      }

      #printable-area,
      #printable-area * {
        visibility: visible;
      }

      #printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }

      .no-print {
        display: none !important;
      }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }

    .dark ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    /* ========================================================================== */
    /* ATURAN KONTRAS TEMA: MODE GELAP - TEXT TERANG, MODE TERANG - TEXT GELAP   */
    /* ========================================================================== */
    html:not(.dark) {
      color-scheme: light;
    }

    html.dark {
      color-scheme: dark;
    }

    /* MODE TERANG: Semua teks tajam, gelap, tegas dan kontras tinggi */
    html:not(.dark) body {
      background-color: #f1f5f9;
      color: #0f172a;
    }
    html:not(.dark) h1, 
    html:not(.dark) h2, 
    html:not(.dark) h3, 
    html:not(.dark) h4, 
    html:not(.dark) h5, 
    html:not(.dark) h6 {
      color: #0f172a;
    }
    html:not(.dark) th {
      color: #1e293b !important;
      background-color: #f8fafc;
    }
    html:not(.dark) label {
      color: #334155 !important;
    }
    html:not(.dark) .text-slate-400 {
      color: #475569 !important; /* Tingkatkan kontras dari abu pudar menjadi abu gelap */
    }
    html:not(.dark) .text-slate-500 {
      color: #334155 !important; /* Lebih tegas dan mudah dibaca */
    }
    html:not(.dark) input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]):not([type="color"]):not([type="file"]),
    html:not(.dark) select,
    html:not(.dark) textarea {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border-color: #cbd5e1 !important;
    }
    html:not(.dark) input::placeholder,
    html:not(.dark) textarea::placeholder {
      color: #94a3b8 !important;
    }

    /* MODE GELAP: Semua teks cerah, terang, kontras tinggi dan mudah terbaca */
    html.dark body {
      background-color: #0f172a;
      color: #f8fafc;
    }
    html.dark h1, 
    html.dark h2, 
    html.dark h3, 
    html.dark h4, 
    html.dark h5, 
    html.dark h6 {
      color: #f8fafc;
    }
    /* Cegah teks slate bernilai gelap tampil gelap di atas background gelap */
    html.dark .text-slate-900,
    html.dark .text-slate-800,
    html.dark .text-slate-700 {
      color: #f1f5f9;
    }
    html.dark .text-slate-600 {
      color: #e2e8f0;
    }
    html.dark .text-slate-500 {
      color: #cbd5e1;
    }
    html.dark .text-slate-400 {
      color: #94a3b8;
    }
    html.dark th {
      color: #f1f5f9 !important;
    }
    html.dark label {
      color: #e2e8f0 !important;
    }
    html.dark input:not([type="checkbox"]):not([type="radio"]):not([type="submit"]):not([type="button"]):not([type="color"]):not([type="file"]),
    html.dark select,
    html.dark textarea {
      background-color: #1e293b !important;
      color: #f8fafc !important;
      border-color: #475569 !important;
    }
    html.dark input::placeholder,
    html.dark textarea::placeholder {
      color: #64748b !important;
    }
  </style>
</head>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Global Config & Firebase Auth Settings
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'joy-print-solution';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {

      authDomain: "joy-print-demo.firebaseapp.com",

      storageBucket: "joy-print-demo.appspot.com",

    };

    let firebaseApp = null;
    let auth = null;
    let db = null;
    let isFirebaseActive = false;

    // Initial Seed Data Fallback for first run
    const initialSeedData = {

        { id: 'BRG-002', nama: 'Tinta Canon 790 Black', kategori: 'Tinta', hpp: 80000, harga: 105000, jumlah: 3, minStok: 5, satuan: 'Botol' },
        { id: 'BRG-003', nama: 'Printhead Epson L3110', kategori: 'Sparepart', hpp: 450000, harga: 580000, jumlah: 2, minStok: 2, satuan: 'Pcs' },
        { id: 'BRG-004', nama: 'Roller Paper Pickup Canon IP2770', kategori: 'Sparepart', hpp: 15000, harga: 35000, jumlah: 8, minStok: 3, satuan: 'Pcs' },
        { id: 'BRG-005', nama: 'Kertas HVS A4 75gr PaperOne', kategori: 'Barang', hpp: 42000, harga: 52000, jumlah: 25, minStok: 10, satuan: 'Rim' }
      ],
      kategoriStok: ['Tinta', 'Sparepart', 'Barang'],
      servis: [

          keluhan: 'Hasil cetak garis-garis & mati total',
          status: 'Menunggu Sparepart',
          biayaJasa: 100000,
          spareparts: [{ id: 'BRG-003', nama: 'Printhead Epson L3110', harga: 580000, qty: 1 }],
          totalBiaya: 680000,
          statusBayar: 'DP',
          bayar: 200000,

        },
        {

          pelangganId: 'CUST-002',
          pelangganNama: 'CV Media Utama',
          pelangganTelepon: '08567890123',

          kelengkapan: 'Unit Printer Saja',
          printer: 'Canon IP2770',
          keluhan: 'Paper Jam terus menerus',
          status: 'Selesai',
          biayaJasa: 75000,

      ],
      penjualan: [

      ],

      ],
      hutangpiutang: [

        { id: 'HP-002', jenis: 'Hutang', pihak: 'Distributor Sparepart X', noRef: 'BUY-002', jumlah: 750000, jatuhTempo: '2026-09-10', status: 'Belum Lunas' }
      ]
    };

    const LOCAL_STORAGE_KEY = 'joy_print_data_v1';

    function loadLocalStorageData() {
      try {
        const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {
        console.warn('Gagal membaca localStorage:', e);
      }
      return null;
    }

    function persistLocalStorageData() {
      try {
        const payload = {
          pelanggan: window.state.pelanggan,
          stok: window.state.stok,
          kategoriStok: window.state.kategoriStok,
          servis: window.state.servis,
          penjualan: window.state.penjualan,
          pembelian: window.state.pembelian,
          kas: window.state.kas,
          operasional: window.state.operasional,
          hutangpiutang: window.state.hutangpiutang
        };
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(payload));
      } catch (e) {
        console.warn('Gagal menyimpan localStorage:', e);
      }
    }

    // State Reactive Application with Instant Local Seed Fallback
    const cachedData = loadLocalStorageData() || initialSeedData;
    const savedTheme = localStorage.getItem('joy_print_theme');
    const isDarkInitial = savedTheme ? savedTheme === 'dark' : true;
    if (!isDarkInitial) {
      document.documentElement.classList.remove('dark');
    }
    const savedRole = localStorage.getItem('joy_print_role');
    const initialRole = (savedRole === 'user' || savedRole === 'admin') ? savedRole : 'admin';
    window.state = {
      role: initialRole,
      activeTab: 'dashboard',
      darkMode: isDarkInitial,
      pelanggan: cachedData.pelanggan ? [...cachedData.pelanggan] : [...initialSeedData.pelanggan],
      stok: cachedData.stok ? [...cachedData.stok] : [...initialSeedData.stok],
      kategoriStok: (cachedData.kategoriStok && cachedData.kategoriStok.length > 0) ? [...cachedData.kategoriStok] : ['Tinta', 'Sparepart', 'Barang'],
      stokFilterCat: 'all',
      stokSearchQuery: '',
      editingHargaId: null,
      servis: cachedData.servis ? [...cachedData.servis] : [...initialSeedData.servis],
      penjualan: cachedData.penjualan ? [...cachedData.penjualan] : [...initialSeedData.penjualan],
      pembelian: cachedData.pembelian ? [...cachedData.pembelian] : [...initialSeedData.pembelian],
      kas: cachedData.kas ? [...cachedData.kas] : [...initialSeedData.kas],
      operasional: cachedData.operasional ? [...cachedData.operasional] : [...initialSeedData.operasional],
      hutangpiutang: cachedData.hutangpiutang ? [...cachedData.hutangpiutang] : [...initialSeedData.hutangpiutang],
      cart: [],
      posCustomer: {
        mode: 'new', // 'new' atau 'existing'
        selectedId: '',
        nama: '',
        telepon: '',
        alamat: '',
        saveToPelanggan: true,
        metode: 'Tunai',
        uangDiterima: 0
      },
      servisCustomer: {
        mode: 'existing', // 'existing' atau 'new'
        selectedId: '',
        nama: '',
        telepon: '',
        alamat: '',
        saveToPelanggan: true
      },
      posFilterCat: 'all'
    };

    const getColRef = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
    const getDocRef = (colName, docId) => doc(db, 'artifacts', appId, 'public', 'data', colName, docId);

    function updateStatusIndicator(isOnline, label) {
      const banner = document.getElementById('db-status');
      if (!banner) return;
      if (isOnline) {
        banner.className = "px-4 py-1.5 mx-3 mb-2 rounded text-[11px] font-medium flex items-center justify-between bg-emerald-500/10 text-emerald-500 border border-emerald-500/20";
        banner.innerHTML = `
          <span class="flex items-center space-x-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>${label || 'Firebase Connected'}</span>
          </span>
          <i data-lucide="database" class="w-3.5 h-3.5"></i>
        `;
      } else {
        banner.className = "px-4 py-1.5 mx-3 mb-2 rounded text-[11px] font-medium flex items-center justify-between bg-cyan-500/10 text-cyan-500 border border-cyan-500/20";
        banner.innerHTML = `
          <span class="flex items-center space-x-1.5">
            <span class="w-2 h-2 rounded-full bg-cyan-500 animate-pulse"></span>
            <span>${label || 'Data Mode Aktif (Offline/Lokal)'}</span>
          </span>
          <i data-lucide="hard-drive" class="w-3.5 h-3.5"></i>
        `;
      }
      lucide.createIcons();
    }

    // Initialize Firebase Realtime Sync with Graceful Local Fallback
    async function initFirebaseSync() {
      const isDemoConfig = !firebaseConfig.apiKey || firebaseConfig.apiKey.includes('DemoKeyOnly');
      if (isDemoConfig) {
        isFirebaseActive = false;
        updateStatusIndicator(false, 'Local Storage Aktif');
        return;
      }

      try {
        firebaseApp = initializeApp(firebaseConfig);
        auth = getAuth(firebaseApp);
        db = getFirestore(firebaseApp);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        isFirebaseActive = true;
        updateStatusIndicator(true, 'Firebase Connected');

        const collections = ['pelanggan', 'stok', 'servis', 'penjualan', 'pembelian', 'kas', 'operasional', 'hutangpiutang'];

        collections.forEach(colName => {
          const colRef = getColRef(colName);

          onSnapshot(colRef, async (snapshot) => {
            if (snapshot.empty && initialSeedData[colName]) {
              for (const item of initialSeedData[colName]) {
                await setDoc(getDocRef(colName, item.id), item);
              }
            } else if (!snapshot.empty) {
              const dataList = [];
              snapshot.forEach(docSnap => {
                dataList.push({ ...docSnap.data(), id: docSnap.id });
              });
              window.state[colName] = dataList;
              persistLocalStorageData();
              window.renderPage();
            }
          }, (err) => {
            console.warn(`Firestore listener warning for ${colName}:`, err);
          });
        });

      } catch (err) {
        console.warn("Firebase Auth/Firestore tidak aktif, menggunakan Local Storage:", err.message);
        isFirebaseActive = false;
        updateStatusIndicator(false, 'Local Storage Aktif');
      }
    }

    // Database Sync Helper Functions for CRUD Operations
    window.dbSave = async function (colName, docId, data) {
      const items = window.state[colName] || [];
      const idx = items.findIndex(i => i.id === docId);
      if (idx >= 0) {
        items[idx] = { ...items[idx], ...data, id: docId };
      } else {
        items.unshift({ ...data, id: docId });
      }
      window.state[colName] = [...items];
      persistLocalStorageData();
      window.renderPage();

      if (isFirebaseActive && db) {
        try {
          await setDoc(getDocRef(colName, docId), data);
        } catch (err) {
          console.error(`Error saving to Firebase ${colName}:`, err);
        }
      }
    };

    window.dbUpdate = async function (colName, docId, data) {
      const items = window.state[colName] || [];
      const idx = items.findIndex(i => i.id === docId);
      if (idx >= 0) {
        items[idx] = { ...items[idx], ...data };
        window.state[colName] = [...items];
        persistLocalStorageData();
        window.renderPage();
      }

      if (isFirebaseActive && db) {
        try {
          await updateDoc(getDocRef(colName, docId), data);
        } catch (err) {
          console.error(`Error updating Firebase ${colName}:`, err);
        }

    };

      window.state[colName] = (window.state[colName] || []).filter(i => i.id !== docId);

      window.renderPage();

    window.getFinancialMetrics = function () {
      const omsetPenjualan = state.penjualan.reduce((acc, curr) => acc + curr.total, 0);
      const omsetServis = state.servis.reduce((acc, curr) => acc + (curr.bayar || 0), 0);
      const totalOmset = omsetPenjualan + omsetServis;

      const hppPenjualan = state.penjualan.reduce((acc, curr) => acc + (curr.hppTotal || 0), 0);
      const hppSparepartServis = state.servis.reduce((acc, s) => {
        const hppItems = (s.spareparts || []).reduce((sum, sp) => {
          const itemMaster = state.stok.find(b => b.id === sp.id);
          return sum + ((itemMaster ? itemMaster.hpp : sp.harga * 0.7) * sp.qty);
        }, 0);
        return acc + hppItems;
      }, 0);
      const totalHPP = hppPenjualan + hppSparepartServis;

      const labaKotor = totalOmset - totalHPP;
      const totalOperasional = state.operasional.reduce((acc, curr) => acc + curr.jumlah, 0);
      const labaBersih = Math.max(0, labaKotor - totalOperasional);

      const pos70 = labaBersih * 0.70;
      const pos20 = labaBersih * 0.20;
      const pos10 = labaBersih * 0.10;

      return {
        totalOmset,
        labaKotor,
        totalOperasional,
        labaBersih,
        pos70,
        pos20,
        pos10
      };
    };

    window.deteksiPelangganServisLive = function () {
      const namaVal = (document.getElementById('srv-cust-nama')?.value || '').trim().toLowerCase();
      const telpVal = (document.getElementById('srv-cust-telp')?.value || '').trim().replace(/\D/g, '');

      const alertBox = document.getElementById('srv-detect-alert');
      const namaEl = document.getElementById('srv-detect-nama');
      const telpEl = document.getElementById('srv-detect-telp');
      const btnEl = document.getElementById('srv-detect-btn');

      if (!alertBox) return;

      if ((namaVal.length >= 3) || (telpVal.length >= 4)) {
        const found = state.pelanggan.find(p => {
          const pTelp = (p.telepon || '').replace(/\D/g, '');
          const matchTelp = telpVal.length >= 4 && pTelp && (pTelp.includes(telpVal) || telpVal.includes(pTelp));
          const matchNama = namaVal.length >= 3 && p.nama.toLowerCase().includes(namaVal);
          return matchTelp || matchNama;
        });

        if (found) {
          namaEl.innerText = found.nama;
          telpEl.innerText = found.telepon || 'Tanpa No. HP';
          btnEl.onclick = () => {
            pilihPelangganServis(found.id, true);

          alertBox.classList.remove('hidden');
          lucide.createIcons();
          return;
        }

      alertBox.classList.add('hidden');

    window.simpanServisBaru = async function (e) {
      e.preventDefault();

      const mode = (state.servisCustomer && state.servisCustomer.mode) ? state.servisCustomer.mode : 'existing';
      let pelangganId = '';
      let pelangganNama = '';
      let pelangganTelepon = '-';
      let pelangganAlamat = '-';
      let isNewCustomerSaved = false;

      if (mode === 'existing') {
        const selectId = document.getElementById('srv-cust-select')?.value || (state.servisCustomer ? state.servisCustomer.selectedId : '');
        const pel = state.pelanggan.find(p => p.id === selectId);
        if (!pel) {
          alert('Silakan pilih pelanggan dari daftar terdaftar, atau beralih ke tab Pelanggan Baru!');
          return;
        }
        pelangganId = pel.id;
        pelangganNama = pel.nama;
        pelangganTelepon = pel.telepon || '-';
        pelangganAlamat = pel.alamat || '-';
      } else {
        // Mode Input Pelanggan Baru
        const namaInput = (document.getElementById('srv-cust-nama')?.value || '').trim();
        const telpInput = (document.getElementById('srv-cust-telp')?.value || '').trim();
        const alamatInput = (document.getElementById('srv-cust-alamat')?.value || '').trim();
        const saveToMaster = document.getElementById('srv-cust-save')?.checked;

        if (!namaInput) {
          alert('Nama pelanggan wajib diisi!');
          return;
        }

        // Cek apakah sudah ada di master data berdasarkan nomor telepon atau nama
        const cleanTelp = telpInput.replace(/\D/g, '');
        const existing = state.pelanggan.find(p => {
          const pTelp = (p.telepon || '').replace(/\D/g, '');
          return (cleanTelp && pTelp && cleanTelp === pTelp) || (p.nama.toLowerCase() === namaInput.toLowerCase());
        });

        if (existing) {
          pelangganId = existing.id;
          pelangganNama = existing.nama;
          let updated = false;
          if ((!existing.telepon || existing.telepon === '-') && telpInput) {
            existing.telepon = telpInput;
            updated = true;
          }
          if ((!existing.alamat || existing.alamat === '-') && alamatInput) {
            existing.alamat = alamatInput;
            updated = true;
          }
          if (updated) {
            await dbUpdate('pelanggan', existing.id, existing);
          }
          pelangganTelepon = existing.telepon || '-';
          pelangganAlamat = existing.alamat || '-';
        } else {
          pelangganId = `CUST-00${state.pelanggan.length + 1}`;
          pelangganNama = namaInput;
          pelangganTelepon = telpInput || '-';
          pelangganAlamat = alamatInput || '-';

          if (saveToMaster) {
            const newCust = {
              id: pelangganId,
              nama: pelangganNama,
              telepon: pelangganTelepon,
              alamat: pelangganAlamat
            };
            await dbSave('pelanggan', pelangganId, newCust);
            isNewCustomerSaved = true;
          }
        }
      }

      const printer = (document.getElementById('srv-printer')?.value || '').trim();
      const keluhan = (document.getElementById('srv-keluhan')?.value || '').trim();
      const kelengkapan = (document.getElementById('srv-kelengkapan')?.value || 'Unit Printer Saja').trim();
      const biayaJasa = parseFloat(document.getElementById('srv-jasa')?.value) || 0;
      const dp = parseFloat(document.getElementById('srv-dp')?.value) || 0;
      const metodeDP = document.getElementById('srv-metode-dp')?.value || 'Tunai';

      const newId = `SRV-2026-00${state.servis.length + 1}`;
      const totalBiaya = biayaJasa;
      const sisa = Math.max(0, totalBiaya - dp);

      const newServis = {
        id: newId,
        tanggal: new Date().toISOString().split('T')[0],
        pelangganId,
        pelangganNama,
        pelangganTelepon,
        pelangganAlamat,
        kelengkapan,
        printer,
        keluhan,
        status: 'Diterima',
        biayaJasa,
        spareparts: [],
        totalBiaya,
        statusBayar: sisa <= 0 ? 'Lunas' : (dp > 0 ? 'DP' : 'Belum Bayar'),
        bayar: dp,
        sisa
      };

      await dbSave('servis', newId, newServis);

      // Jika ada DP dan metode tunai, otomatis catat pemasukan kas toko
      if (dp > 0 && metodeDP === 'Tunai') {
        const kasId = `KAS-00${state.kas.length + 1}`;
        await dbSave('kas', kasId, {
          id: kasId,
          tanggal: new Date().toISOString().split('T')[0],
          tipe: 'Masuk',
          kategori: 'DP Servis Printer',
          keterangan: `DP Servis #${newId} (${pelangganNama} - ${printer})`,
          jumlah: dp
        });
      }

      // Jika ada sisa tagihan, otomatis catat piutang
      if (sisa > 0) {
        const hpId = `HP-00${state.hutangpiutang.length + 1}`;
        await dbSave('hutangpiutang', hpId, {
          id: hpId,
          jenis: 'Piutang',
          pihak: pelangganNama,
          noRef: newId,
          jumlah: sisa,
          jatuhTempo: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
          status: 'Belum Lunas'
        });
      }

      if (state.servisCustomer) {
        state.servisCustomer.selectedId = pelangganId;
        state.servisCustomer.mode = 'existing';
      }

      closeModal();

      // Tampilkan popup konfirmasi sukses & opsi cetak nota tanda terima
      setTimeout(() => {
        openModal(`
          <div class="text-center space-y-4 py-3">
            <div class="w-14 h-14 bg-emerald-500/10 text-emerald-500 rounded-full flex items-center justify-center mx-auto shadow-inner">
              <i data-lucide="check-circle" class="w-8 h-8"></i>
            </div>
            <div>
              <span class="text-xs font-bold font-mono bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 px-2.5 py-1 rounded-full">Tiket: ${newId}</span>
              <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 mt-2">Penerimaan Servis Berhasil Dicatat!</h3>
              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                Unit <strong>${printer}</strong> milik <strong>${pelangganNama}</strong> telah masuk antrean servis.
              </p>
              ${isNewCustomerSaved ? `
                <div class="mt-2 text-xs p-2 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 inline-block">
                  ✓ Pelanggan baru otomatis tersimpan ke <strong>Data Pelanggan (ID: ${pelangganId})</strong>
                </div>
              ` : `
                <div class="mt-2 text-xs p-2 rounded-lg bg-cyan-500/10 border border-cyan-500/20 text-cyan-600 dark:text-cyan-400 inline-block">
                  ✓ Menggunakan data pelanggan terdaftar: <strong>${pelangganNama} (${pelangganId})</strong>
                </div>
              `}
            </div>
            <div class="flex justify-center space-x-2 pt-2">
              <button onclick="cetakNotaServis('${newId}')" class="px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-600 text-white font-bold text-sm shadow-md shadow-cyan-500/25 flex items-center space-x-2 transition">
                <i data-lucide="printer" class="w-4 h-4"></i>
                <span>Cetak Nota Tanda Terima</span>
              </button>
              <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 font-semibold text-sm hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                Selesai
              </button>
            </div>
          </div>
        `);
      }, 250);
    };

    window.updateStatusServis = async function (id, statusBaru) {
      await dbUpdate('servis', id, { status: statusBaru });
    };

    window.cetakNotaServis = function (id) {
      const s = state.servis.find(item => item.id === id);
      if (!s) return;

      const printArea = document.getElementById('printable-area');

        <div style="width: 300px; font-size: 11px; margin: 0 auto; font-family: monospace;">
          <h2 style="text-align:center; font-weight:bold; margin-bottom: 2px;">JOY PRINT SOLUTION</h2>
          <p style="text-align:center; margin:0;">Tanda Terima Servis Printer</p>
          <p style="text-align:center; margin:0 0 8px 0;">WA Toko: 0812-3456-7890</p>
          <hr style="border-top:1px dashed #000;" />
          <p style="margin:2px 0;"><strong>No. Tiket:</strong> ${s.id}</p>
          <p style="margin:2px 0;"><strong>Tanggal:</strong> ${s.tanggal}</p>
          <p style="margin:2px 0;"><strong>Pelanggan:</strong> ${s.pelangganNama}</p>

          ${s.pelangganAlamat && s.pelangganAlamat !== '-' ? `<p style="margin:2px 0;"><strong>Alamat:</strong> ${s.pelangganAlamat}</p>` : ''}

          <p style="margin:2px 0;"><strong>Unit Printer:</strong> ${s.printer}</p>
          ${s.kelengkapan ? `<p style="margin:2px 0;"><strong>Kelengkapan:</strong> ${s.kelengkapan}</p>` : ''}
          <p style="margin:2px 0;"><strong>Keluhan:</strong> ${s.keluhan}</p>
          <p style="margin:2px 0;"><strong>Status:</strong> ${s.status}</p>
          <hr style="border-top:1px dashed #000;" />
          <table style="width:100%;">
            <tr><td>Biaya Jasa Servis</td><td style="text-align:right;">${formatRp(s.biayaJasa)}</td></tr>
            ${(s.spareparts || []).map(sp => `<tr><td>${sp.nama} (x${sp.qty})</td><td style="text-align:right;">${formatRp(sp.harga * sp.qty)}</td></tr>`).join('')}
          </table>
          <hr style="border-top:1px dashed #000;" />
          <p style="display:flex; justify-content:space-between; margin: 2px 0;"><strong>Total Biaya:</strong> <strong>${formatRp(s.totalBiaya)}</strong></p>
          <p style="display:flex; justify-content:space-between; margin: 2px 0;"><strong>Bayar / DP:</strong> <strong>${formatRp(s.bayar)}</strong></p>
          <p style="display:flex; justify-content:space-between; margin: 2px 0;"><strong>Sisa Tagihan:</strong> <strong>${formatRp(s.sisa)}</strong></p>
          <hr style="border-top:1px dashed #000;" />
          <p style="text-align:center; margin-top:10px; font-size:10px;">Harap bawa tanda terima ini saat pengambilan unit printer. Terima Kasih!</p>
        </div>
      `;
      printArea.classList.remove('hidden');
      window.print();
      printArea.classList.add('hidden');
    };

    function renderPOSView() {
      const totalBelanja = state.cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      const uangBayar = typeof state.posCustomer.uangDiterima === 'number' && state.posCustomer.uangDiterima > 0
        ? state.posCustomer.uangDiterima
        : (totalBelanja > 0 ? totalBelanja : 0);
      const kembalian = uangBayar - totalBelanja;
      const currentCat = state.posFilterCat || 'all';

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 h-full">
          <!-- Kolom Kiri: Katalog & Pencarian Barang (7 Kolom) -->
          <div class="lg:col-span-7 space-y-4 flex flex-col h-full overflow-hidden">
            <!-- Header Pencarian, Kategori & Riwayat -->
            <div class="space-y-3 shrink-0">
              <div class="flex items-center gap-3">
                <div class="relative flex-1">
                  <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                  <input type="text" id="search-pos" onkeyup="filterPOSItems()" placeholder="Cari nama barang / sparepart..." class="w-full pl-9 pr-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:border-cyan-500" />
                </div>
                <button onclick="openRiwayatPenjualanModal()" class="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold border border-slate-200 dark:border-slate-700 flex items-center space-x-1.5 shadow-sm transition shrink-0" title="Lihat Riwayat Transaksi POS">
                  <i data-lucide="history" class="w-4 h-4 text-cyan-500"></i>
                  <span class="hidden sm:inline">Riwayat POS</span>
                  <span class="px-1.5 py-0.2 rounded-full bg-cyan-500/20 text-cyan-500 text-[10px] font-bold">${state.penjualan.length}</span>
                </button>
              </div>

              <!-- Filter Kategori Tabs Dinamis -->
              <div class="flex items-center space-x-2 overflow-x-auto pb-1 text-xs">
                <button onclick="filterPOSCategory('all')" class="px-3 py-1.5 rounded-lg font-bold transition shrink-0 ${currentCat === 'all' ? 'bg-cyan-500 text-white shadow-md shadow-cyan-500/20' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700'}">
                  Semua Item
                </button>
                ${getKategoriStokList().map(kat => `
                  <button onclick="filterPOSCategory('${kat.replace(/'/g, "\\'")}')" class="px-3 py-1.5 rounded-lg font-bold transition shrink-0 ${currentCat.toLowerCase() === kat.toLowerCase() ? 'bg-cyan-500 text-white shadow-md shadow-cyan-500/20' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-700'}">
                    ${kat}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Grid Daftar Barang -->
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 overflow-y-auto pr-1 flex-1 max-h-[calc(100vh-230px)]" id="pos-grid">
              ${renderPOSGridItems()}
            </div>
          </div>

          <!-- Kolom Kanan: Data Pembeli, Keranjang & Pembayaran (5 Kolom) -->
          <div class="lg:col-span-5 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 sm:p-5 flex flex-col justify-between shadow-sm overflow-y-auto max-h-[calc(100vh-130px)] space-y-4">
            
            <!-- 1. DATA PEMBELI (INPUT LENGKAP & COLLECT KE DATA PELANGGAN) -->
            <div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-cyan-600 dark:text-cyan-400 flex items-center space-x-1.5">
                  <i data-lucide="user-check" class="w-4 h-4"></i>
                  <span>Data Pembeli / Pelanggan</span>
                </span>
                
                <div class="flex items-center space-x-1 bg-slate-200 dark:bg-slate-800 p-0.5 rounded-lg text-xs">
                  <button type="button" onclick="setPosCustomerMode('new')" class="px-2.5 py-1 rounded-md font-semibold transition ${state.posCustomer.mode === 'new' ? 'bg-cyan-500 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-cyan-500'}">
                    Baru / Walk-in
                  </button>
                  <button type="button" onclick="setPosCustomerMode('existing')" class="px-2.5 py-1 rounded-md font-semibold transition ${state.posCustomer.mode === 'existing' ? 'bg-cyan-500 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-cyan-500'}">
                    Pelanggan Terdaftar
                  </button>
                </div>
              </div>

              ${state.posCustomer.mode === 'existing' ? `
                <div class="space-y-2">
                  <label class="text-[11px] font-semibold text-slate-500 dark:text-slate-400 block">Pilih dari Master Pelanggan:</label>
                  <select onchange="selectPosCustomer(this.value)" class="w-full text-xs p-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 font-medium focus:outline-none focus:border-cyan-500">
                    <option value="">-- Pilih Pelanggan (${state.pelanggan.length} Terdaftar) --</option>
                    ${state.pelanggan.map(p => `
                      <option value="${p.id}" ${state.posCustomer.selectedId === p.id ? 'selected' : ''}>
                        ${p.nama} (${p.telepon || 'Tanpa No. WA'})
                      </option>
                    `).join('')}
                  </select>

                  ${state.posCustomer.selectedId ? `
                    <div class="p-2.5 rounded-lg bg-cyan-500/10 border border-cyan-500/20 text-xs space-y-1">
                      <div class="flex justify-between font-bold text-cyan-600 dark:text-cyan-400">
                        <span>${state.posCustomer.nama}</span>
                        <span class="font-mono text-[10px] bg-cyan-500/20 px-1.5 py-0.2 rounded">${state.posCustomer.selectedId}</span>
                      </div>
                      <p class="text-slate-500 dark:text-slate-400 text-[11px]">📱 WA: <strong>${state.posCustomer.telepon || '-'}</strong></p>
                      <p class="text-slate-500 dark:text-slate-400 text-[11px]">📍 Alamat: <strong>${state.posCustomer.alamat || '-'}</strong></p>
                    </div>
                  ` : '<p class="text-[11px] text-slate-400 italic">Silakan pilih pelanggan terdaftar di atas.</p>'}
                </div>
              ` : `
                <div class="space-y-2">
                  <div class="flex justify-between items-center">
                    <label class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Input Data Pembeli Baru:</label>
                    <button type="button" onclick="quickSetUmumCustomer()" class="text-[10px] text-cyan-500 hover:underline font-semibold flex items-center space-x-1">
                      <i data-lucide="zap" class="w-3 h-3"></i>
                      <span>Set: Umum / Cash</span>
                    </button>
                  </div>

                  <div>
                    <input type="text" id="pos-cust-nama" value="${state.posCustomer.nama || ''}" oninput="updatePosCustomerInput('nama', this.value)" placeholder="Nama Lengkap / Perusahaan Pembeli *" class="w-full text-xs p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-cyan-500 font-semibold" required />
                  </div>

                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <input type="text" id="pos-cust-telp" value="${state.posCustomer.telepon || ''}" oninput="updatePosCustomerInput('telepon', this.value)" placeholder="No. WhatsApp / HP" class="w-full text-xs p-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-cyan-500" />
                    </div>
                    <div>
                      <input type="text" id="pos-cust-alamat" value="${state.posCustomer.alamat || ''}" oninput="updatePosCustomerInput('alamat', this.value)" placeholder="Alamat / Kota" class="w-full text-xs p-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-cyan-500" />
                    </div>
                  </div>

                  <div class="pt-1.5 border-t border-slate-200 dark:border-slate-700/60">
                    <label class="flex items-start space-x-2 text-xs text-cyan-600 dark:text-cyan-400 font-semibold cursor-pointer select-none">
                      <input type="checkbox" id="pos-cust-save" ${state.posCustomer.saveToPelanggan ? 'checked' : ''} onchange="togglePosSaveCustomer(this.checked)" class="mt-0.5 rounded text-cyan-500 focus:ring-cyan-400 w-4 h-4 cursor-pointer" />
                      <div>
                        <span>Kumpulkan otomatis ke Data Master Pelanggan</span>
                        <p class="text-[10px] text-slate-400 font-normal leading-tight mt-0.5">Jika dicentang, pembeli ini akan otomatis tercatat di menu <strong>Data Pelanggan</strong> untuk transaksi berikutnya.</p>
                      </div>
                    </label>
                  </div>
                </div>
              `}
            </div>

            <!-- 2. KERANJANG PENJUALAN -->
            <div class="space-y-3">
              <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-2">
                <span class="font-bold text-xs uppercase tracking-wider text-slate-700 dark:text-slate-300 flex items-center space-x-1.5">
                  <i data-lucide="shopping-cart" class="w-4 h-4 text-cyan-500"></i>
                  <span>Item Dalam Keranjang</span>
                </span>
                <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-500">${state.cart.length} item</span>
              </div>

              <div class="space-y-2.5 max-h-[220px] overflow-y-auto pr-1">
                ${state.cart.length === 0 ? `
                  <div class="text-center py-6 text-slate-400 text-xs space-y-1">
                    <i data-lucide="shopping-bag" class="w-8 h-8 mx-auto opacity-40"></i>
                    <p>Keranjang masih kosong.</p>
                    <p class="text-[11px] text-slate-500">Klik item di sebelah kiri untuk menambahkan barang.</p>
                  </div>
                ` : ''}

                ${state.cart.map((item, idx) => `
                  <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-slate-200/70 dark:border-slate-700/50">
                    <div class="flex-1 pr-2 min-w-0">
                      <h5 class="font-bold text-xs truncate text-slate-800 dark:text-slate-100">${item.nama}</h5>
                      <span class="text-[11px] text-cyan-600 dark:text-cyan-400 font-semibold">${formatRp(item.harga)}</span>
                    </div>
                    <div class="flex items-center space-x-1.5 shrink-0">
                      <button onclick="updateCartQty(${idx}, -1)" class="w-6 h-6 rounded bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 flex items-center justify-center font-bold text-xs transition">-</button>
                      <span class="text-xs font-bold w-6 text-center">${item.qty}</span>
                      <button onclick="updateCartQty(${idx}, 1)" class="w-6 h-6 rounded bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 flex items-center justify-center font-bold text-xs transition">+</button>
                      <button onclick="removeCartItem(${idx})" class="w-6 h-6 rounded text-rose-500 hover:bg-rose-500/10 flex items-center justify-center transition" title="Hapus">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- 3. PEMBAYARAN, NOMINAL & KEMBALIAN -->
            <div class="pt-3 border-t border-slate-200 dark:border-slate-700 space-y-3">
              <!-- Metode Pembayaran -->
              <div>
                <label class="text-[11px] font-semibold text-slate-500 dark:text-slate-400 block mb-1">Metode Pembayaran:</label>
                <div class="grid grid-cols-3 gap-1.5">
                  <button type="button" onclick="setPosPaymentMethod('Tunai')" class="py-1.5 px-2 rounded-lg text-xs font-semibold flex items-center justify-center space-x-1 border ${state.posCustomer.metode === 'Tunai' ? 'bg-cyan-500 text-white border-cyan-500 shadow-sm' : 'border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50'}">
                    <i data-lucide="banknote" class="w-3.5 h-3.5"></i>
                    <span>Tunai</span>
                  </button>
                  <button type="button" onclick="setPosPaymentMethod('Transfer / QRIS')" class="py-1.5 px-2 rounded-lg text-xs font-semibold flex items-center justify-center space-x-1 border ${state.posCustomer.metode === 'Transfer / QRIS' ? 'bg-cyan-500 text-white border-cyan-500 shadow-sm' : 'border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50'}">
                    <i data-lucide="qr-code" class="w-3.5 h-3.5"></i>
                    <span>QRIS</span>
                  </button>
                  <button type="button" onclick="setPosPaymentMethod('Debit / Kartu')" class="py-1.5 px-2 rounded-lg text-xs font-semibold flex items-center justify-center space-x-1 border ${state.posCustomer.metode === 'Debit / Kartu' ? 'bg-cyan-500 text-white border-cyan-500 shadow-sm' : 'border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50'}">
                    <i data-lucide="credit-card" class="w-3.5 h-3.5"></i>
                    <span>Debit</span>
                  </button>
                </div>
              </div>

              <!-- Total Tagihan Display -->
              <div class="flex justify-between items-baseline p-3 rounded-xl bg-slate-50 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-700">
                <span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase">Total Tagihan:</span>
                <span class="text-2xl font-black text-cyan-600 dark:text-cyan-400">${formatRp(totalBelanja)}</span>
              </div>

              <!-- Uang Diterima & Kembalian (Jika Tunai) -->
              ${state.posCustomer.metode === 'Tunai' ? `
                <div class="space-y-2">
                  <div class="flex items-center justify-between">
                    <label class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Uang Diterima (Rp):</label>
                    <div class="flex items-center space-x-1">
                      <button type="button" onclick="setPosCashPreset('pas', ${totalBelanja})" class="text-[10px] px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 hover:bg-cyan-500 hover:text-white transition font-semibold">Uang Pas</button>
                      <button type="button" onclick="setPosCashPreset(50000, ${totalBelanja})" class="text-[10px] px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 hover:bg-cyan-500 hover:text-white transition font-semibold">50rb</button>
                      <button type="button" onclick="setPosCashPreset(100000, ${totalBelanja})" class="text-[10px] px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 hover:bg-cyan-500 hover:text-white transition font-semibold">100rb</button>
                      <button type="button" onclick="setPosCashPreset(200000, ${totalBelanja})" class="text-[10px] px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 hover:bg-cyan-500 hover:text-white transition font-semibold">200rb</button>
                    </div>
                  </div>
                  <input type="number" id="pos-cash-input" value="${uangBayar || ''}" oninput="updatePosUangDiterima(this.value, ${totalBelanja})" placeholder="0" class="w-full text-sm font-bold p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-cyan-500" />
                  
                  <div class="flex justify-between items-center text-xs px-1">
                    <span class="text-slate-500 dark:text-slate-400 font-semibold">Kembalian:</span>
                    <span id="pos-kembalian-display" class="font-extrabold text-sm ${kembalian >= 0 ? 'text-emerald-500' : 'text-rose-500'}">
                      ${formatRp(Math.max(0, kembalian))} ${kembalian < 0 ? `(Kurang ${formatRp(Math.abs(kembalian))})` : ''}
                    </span>
                  </div>
                </div>
              ` : ''}

              <!-- Tombol Selesaikan & Cetak Struk -->
              <button type="button" onclick="prosesCheckoutPOS()" ${state.cart.length === 0 ? 'disabled' : ''} class="w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 disabled:opacity-50 text-white font-bold text-sm shadow-lg shadow-cyan-500/25 transition flex items-center justify-center space-x-2">
                <i data-lucide="printer" class="w-4 h-4"></i>
                <span>Selesaikan & Cetak Struk</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderPOSGridItems() {
      const keyword = (document.getElementById('search-pos')?.value || '').toLowerCase();
      const cat = state.posFilterCat || 'all';

      const filtered = state.stok.filter(b => {
        const matchCat = cat === 'all' || b.kategori.toLowerCase() === cat.toLowerCase();
        const matchKey = !keyword || b.nama.toLowerCase().includes(keyword) || (b.kategori || '').toLowerCase().includes(keyword);
        return matchCat && matchKey;
      });

      if (filtered.length === 0) {
        return '<div class="col-span-full text-center py-12 text-slate-400 text-sm"><i data-lucide="package-search" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>Barang / sparepart tidak ditemukan.</div>';
      }

      return filtered.map(b => `
        <div onclick="addToCart('${b.id}')" class="p-3.5 rounded-2xl bg-white dark:bg-slate-800 border ${b.jumlah <= 0 ? 'border-rose-300 dark:border-rose-900/50 opacity-60 cursor-not-allowed' : 'border-slate-200 dark:border-slate-700 hover:border-cyan-500 cursor-pointer shadow-sm'} transition space-y-2 flex flex-col justify-between group">
          <div>
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 uppercase">${b.kategori}</span>
              ${b.jumlah <= b.minStok ? `<span class="text-[10px] font-bold px-1.5 py-0.2 rounded ${b.jumlah <= 0 ? 'bg-rose-500 text-white' : 'bg-rose-500/10 text-rose-500'}">${b.jumlah <= 0 ? 'Habis' : 'Stok Menipis'}</span>` : ''}
            </div>
            <h4 class="font-bold text-sm text-slate-800 dark:text-slate-100 mt-1 line-clamp-2 group-hover:text-cyan-500 transition-colors">${b.nama}</h4>
          </div>
          <div class="pt-2 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
            <span class="text-xs text-slate-400 font-normal">Stok: <strong class="${b.jumlah <= b.minStok ? 'text-rose-500 font-bold' : 'text-slate-600 dark:text-slate-300'}">${b.jumlah}</strong> ${b.satuan}</span>
            <span class="font-black text-cyan-600 dark:text-cyan-400 text-sm">${formatRp(b.harga)}</span>
          </div>
        </div>
      `).join('');
    }

    window.filterPOSCategory = function (cat) {
      state.posFilterCat = cat;
      renderPage();
    };

    window.filterPOSItems = function () {
      const grid = document.getElementById('pos-grid');
      if (grid) {
        grid.innerHTML = renderPOSGridItems();
        lucide.createIcons();
      }
    };

    window.setPosCustomerMode = function (mode) {
      state.posCustomer.mode = mode;
      if (mode === 'existing' && !state.posCustomer.selectedId && state.pelanggan.length > 0) {
        selectPosCustomer(state.pelanggan[0].id);
      } else {
        renderPage();
      }
    };

    window.selectPosCustomer = function (customerId) {
      const p = state.pelanggan.find(item => item.id === customerId);
      if (p) {
        state.posCustomer.selectedId = p.id;
        state.posCustomer.nama = p.nama;
        state.posCustomer.telepon = p.telepon;
        state.posCustomer.alamat = p.alamat;
      } else {
        state.posCustomer.selectedId = '';
        state.posCustomer.nama = '';
        state.posCustomer.telepon = '';
        state.posCustomer.alamat = '';
      }
      renderPage();
    };

    window.updatePosCustomerInput = function (field, val) {
      state.posCustomer[field] = val;
    };

    window.togglePosSaveCustomer = function (checked) {
      state.posCustomer.saveToPelanggan = checked;
    };

    window.quickSetUmumCustomer = function () {
      state.posCustomer.mode = 'new';
      state.posCustomer.selectedId = '';
      state.posCustomer.nama = 'Umum / Cash';
      state.posCustomer.telepon = '-';
      state.posCustomer.alamat = '-';
      state.posCustomer.saveToPelanggan = false;
      renderPage();
    };

    window.setPosPaymentMethod = function (method) {
      state.posCustomer.metode = method;
      renderPage();
    };

    window.updatePosUangDiterima = function (amount, total) {
      const bayar = parseFloat(amount) || 0;
      state.posCustomer.uangDiterima = bayar;
      const kembalian = bayar - total;
      const display = document.getElementById('pos-kembalian-display');
      if (display) {
        display.className = `font-extrabold text-sm ${kembalian >= 0 ? 'text-emerald-500' : 'text-rose-500'}`;
        display.innerText = `${formatRp(Math.max(0, kembalian))} ${kembalian < 0 ? `(Kurang ${formatRp(Math.abs(kembalian))})` : ''}`;
      }
    };

    window.setPosCashPreset = function (preset, total) {
      let bayar = 0;
      if (preset === 'pas') {
        bayar = total;
      } else {
        bayar = preset;
      }
      state.posCustomer.uangDiterima = bayar;
      const cashInput = document.getElementById('pos-cash-input');
      if (cashInput) cashInput.value = bayar;
      updatePosUangDiterima(bayar, total);
    };

    window.addToCart = function (id) {
      const b = state.stok.find(item => item.id === id);
      if (!b || b.jumlah <= 0) {
        alert('Stok barang habis!');
        return;
      }
      const existing = state.cart.find(c => c.id === id);
      if (existing) {
        if (existing.qty < b.jumlah) {
          existing.qty += 1;
        } else {
          alert('Mencapai batas stok yang tersedia!');
        }
      } else {
        state.cart.push({ id: b.id, nama: b.nama, harga: b.harga, hpp: b.hpp, qty: 1 });
      }

      // Default cash received to total if Tunai and was equal to previous total
      const totalBelanja = state.cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      if (state.posCustomer.metode === 'Tunai' && (!state.posCustomer.uangDiterima || state.posCustomer.uangDiterima < totalBelanja)) {
        state.posCustomer.uangDiterima = totalBelanja;
      }
      renderPage();
    };

    window.updateCartQty = function (idx, change) {
      const item = state.cart[idx];
      const stokItem = state.stok.find(b => b.id === item.id);
      item.qty += change;
      if (item.qty <= 0) {
        state.cart.splice(idx, 1);
      } else if (stokItem && item.qty > stokItem.jumlah) {
        item.qty = stokItem.jumlah;
        alert('Mencapai batas stok!');
      }

      const totalBelanja = state.cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      if (state.posCustomer.metode === 'Tunai') {
        state.posCustomer.uangDiterima = totalBelanja;
      }
      renderPage();
    };

    window.removeCartItem = function (idx) {
      state.cart.splice(idx, 1);
      const totalBelanja = state.cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      if (state.posCustomer.metode === 'Tunai') {
        state.posCustomer.uangDiterima = totalBelanja;
      }
      renderPage();
    };

    window.prosesCheckoutPOS = async function () {
      if (state.cart.length === 0) {
        alert('Keranjang belanja masih kosong! Silakan pilih barang terlebih dahulu.');
        return;
      }

      const total = state.cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      const hppTotal = state.cart.reduce((sum, item) => sum + (item.hpp * item.qty), 0);

      const cust = state.posCustomer || {};
      const namaPembeli = (cust.nama || '').trim() || 'Umum / Cash';
      const teleponPembeli = (cust.telepon || '').trim();
      const alamatPembeli = (cust.alamat || '').trim();
      const metode = cust.metode || 'Tunai';
      const uangDiterima = typeof cust.uangDiterima === 'number' && cust.uangDiterima > 0 ? cust.uangDiterima : total;

      if (metode === 'Tunai' && uangDiterima < total) {
        alert(`Uang diterima (${formatRp(uangDiterima)}) kurang dari total tagihan (${formatRp(total)})!`);
        return;
      }

      let pelangganId = cust.selectedId || null;
      let isNewlyCollected = false;

      // Fitur Koleksi Data Pembeli ke Master Data Pelanggan
      if (cust.saveToPelanggan && namaPembeli && namaPembeli.toLowerCase() !== 'umum / cash') {
        // Cek apakah pelanggan sudah ada berdasarkan no telepon atau nama
        const existing = state.pelanggan.find(p =>
          (teleponPembeli && p.telepon && p.telepon === teleponPembeli) ||
          p.nama.toLowerCase() === namaPembeli.toLowerCase()
        );

        if (existing) {
          pelangganId = existing.id;
          // Perbarui informasi telepon / alamat jika sebelumnya kosong
          let updated = false;
          if ((!existing.telepon || existing.telepon === '-') && teleponPembeli) {
            existing.telepon = teleponPembeli;
            updated = true;
          }
          if ((!existing.alamat || existing.alamat === '-') && alamatPembeli) {
            existing.alamat = alamatPembeli;
            updated = true;
          }
          if (updated) {
            await dbUpdate('pelanggan', existing.id, existing);
          }
        } else {
          // Buat pelanggan baru di Data Pelanggan
          pelangganId = `CUST-00${state.pelanggan.length + 1}`;
          const newCustomer = {
            id: pelangganId,
            nama: namaPembeli,
            telepon: teleponPembeli || '-',
            alamat: alamatPembeli || '-'
          };
          await dbSave('pelanggan', pelangganId, newCustomer);
          isNewlyCollected = true;
        }
      }

      const trxId = `TRX-2026-00${state.penjualan.length + 1}`;
      const kembalian = Math.max(0, uangDiterima - total);

      const newPenjualan = {
        id: trxId,
        tanggal: new Date().toISOString().split('T')[0],
        pelangganId: pelangganId || 'UMUM',
        pelangganNama: namaPembeli,
        pelangganTelepon: teleponPembeli || '-',
        pelangganAlamat: alamatPembeli || '-',
        items: state.cart.map(i => ({ ...i, subtotal: i.harga * i.qty })),
        total,
        hppTotal,
        labaKotor: total - hppTotal,
        metode,
        bayar: uangDiterima,
        kembalian
      };

      // Kurangi stok barang di database
      for (const cartItem of state.cart) {
        const stokDoc = state.stok.find(s => s.id === cartItem.id);
        if (stokDoc) {
          const newQty = Math.max(0, stokDoc.jumlah - cartItem.qty);
          await dbUpdate('stok', cartItem.id, { jumlah: newQty });
        }
      }

      // Catat ke transaksi penjualan
      await dbSave('penjualan', trxId, newPenjualan);

      // Jika tunai, otomatis catat pemasukan di Kas Toko
      if (metode === 'Tunai') {
        const kasId = `KAS-00${state.kas.length + 1}`;
        await dbSave('kas', kasId, {
          id: kasId,
          tanggal: new Date().toISOString().split('T')[0],
          tipe: 'Masuk',
          kategori: 'Penjualan POS',
          keterangan: `Penjualan Kasir #${trxId} (${namaPembeli})`,
          jumlah: total
        });
      }

      // Cetak struk penjualan
      cetakNotaPOS(newPenjualan);

      // Reset keranjang & form pembeli
      state.cart = [];
      state.posCustomer = {
        mode: 'new',
        selectedId: '',
        nama: '',
        telepon: '',
        alamat: '',
        saveToPelanggan: true,
        metode: 'Tunai',
        uangDiterima: 0
      };

      renderPage();

      if (isNewlyCollected) {
        openModal(`
          <div class="text-center space-y-4 py-3">
            <div class="w-14 h-14 bg-emerald-500/10 text-emerald-500 rounded-full flex items-center justify-center mx-auto">
              <i data-lucide="check-circle" class="w-8 h-8"></i>
            </div>
            <div>
              <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Transaksi Berhasil & Pelanggan Terdaftar!</h3>
              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                Transaksi <strong>#${trxId}</strong> selesai dicetak. Data pembeli <strong>"${namaPembeli}"</strong> telah otomatis dikumpulkan dan tersimpan ke <strong>Data Pelanggan (ID: ${pelangganId})</strong>.
              </p>
            </div>
            <div class="flex justify-center space-x-2 pt-2">
              <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-cyan-500 text-white font-bold text-sm shadow-md shadow-cyan-500/20">

              </button>
              <button onclick="closeModal(); navigateTo('pelanggan');" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 font-semibold text-sm hover:bg-slate-200">

        target = Math.ceil(target / 500) * 500;
      } else {
        target = Math.ceil(target / 100) * 100;
      }
      input.value = target;
      updateMarginPreviewQuickEdit(hpp);
    };

      const newHarga = parseFloat(input.value);
      if (isNaN(newHarga) || newHarga < 0) {
        alert('Harga jual harus berupa angka valid dan minimal 0!');
        return;
      }
      const item = state.stok.find(s => s.id === id);
      const nama = item ? item.nama : id;
      await dbUpdate('stok', id, { harga: newHarga });
      closeModal();
      showNotificationToast(`Harga jual "${nama}" berhasil diubah menjadi ${formatRp(newHarga)}!`);
    };

    window.updateNewStokMarginPreview = function () {
      const preview = document.getElementById('new-stk-margin-preview');

      if (!preview || !hppInput || !hargaInput) return;

      const hpp = parseFloat(hppInput.value) || 0;
      const harga = parseFloat(hargaInput.value) || 0;
      if (hpp === 0 && harga === 0) {
        preview.classList.add('hidden');
        return;
      }
      preview.classList.remove('hidden');
      const profit = harga - hpp;
      const marginPct = hpp > 0 ? ((profit / hpp) * 100).toFixed(1) : (harga > 0 ? 100 : 0);

      if (profit > 0) {
        preview.className = "text-xs p-2.5 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-between";
        preview.innerHTML = `<span>Estimasi Keuntungan: <strong>+${formatRp(profit)}</strong> / item</span><span class="font-bold">+${marginPct}% Margin</span>`;
      } else if (profit === 0) {
        preview.className = "text-xs p-2.5 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-600 dark:text-amber-400 flex items-center justify-between";
        preview.innerHTML = `<span>Titik Impas: Harga jual sama dengan HPP</span><span class="font-bold">0% Margin</span>`;
      } else {
        preview.className = "text-xs p-2.5 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-500 flex items-center justify-between";
        preview.innerHTML = `<span>⚠️ Peringatan: Harga jual di bawah modal HPP (Rugi ${formatRp(Math.abs(profit))})</span><span class="font-bold">${marginPct}%</span>`;
      }

    window.simpanStokBaru = async function (e) {
      e.preventDefault();
      const nama = document.getElementById('stk-nama').value.trim();
      let kategori = document.getElementById('stk-kategori').value.trim();
      if (!kategori) kategori = 'Barang';

      if (!state.kategoriStok) state.kategoriStok = ['Tinta', 'Sparepart', 'Barang'];
      const catExists = state.kategoriStok.some(k => k.toLowerCase() === kategori.toLowerCase());
      if (!catExists) {
        state.kategoriStok.push(kategori);
      }

      const id = `BRG-00${state.stok.length + 1}`;
      const newStok = {
        id,
        nama,
        kategori,
        satuan: document.getElementById('stk-satuan').value.trim() || 'Pcs',
        hpp: parseFloat(document.getElementById('stk-hpp').value) || 0,
        harga: parseFloat(document.getElementById('stk-harga').value) || 0,
        jumlah: parseInt(document.getElementById('stk-jumlah').value) || 0,
        minStok: parseInt(document.getElementById('stk-min').value) || 3
      };
      await dbSave('stok', id, newStok);
      closeModal();
      showNotificationToast(`Stok baru "${nama}" berhasil ditambahkan!`);
    };

    window.simpanEditStok = async function (e, id) {
      e.preventDefault();
      const nama = document.getElementById('edit-stk-nama').value.trim();
      let kategori = document.getElementById('edit-stk-kategori').value.trim();
      if (!kategori) kategori = 'Barang';

      if (!state.kategoriStok) state.kategoriStok = ['Tinta', 'Sparepart', 'Barang'];
      const catExists = state.kategoriStok.some(k => k.toLowerCase() === kategori.toLowerCase());
      if (!catExists) {
        state.kategoriStok.push(kategori);
      }

      const updateData = {
        nama,
        kategori,
        satuan: document.getElementById('edit-stk-satuan').value.trim() || 'Pcs',
        hpp: parseFloat(document.getElementById('edit-stk-hpp').value) || 0,
        harga: parseFloat(document.getElementById('edit-stk-harga').value) || 0,
        jumlah: parseInt(document.getElementById('edit-stk-jumlah').value) || 0,
        minStok: parseInt(document.getElementById('edit-stk-min').value) || 3
      };
      await dbUpdate('stok', id, updateData);
      closeModal();
      showNotificationToast(`Data & harga jual "${nama}" berhasil diperbarui!`);
    };

                        <span class="text-[11px] text-slate-400 block">${itemCount} item barang menggunakan kategori ini</span>
                      </div>
                    </div>
                    <button onclick="hapusKategori('${kat.replace(/'/g, "\\'")}')" class="p-2 rounded-lg text-rose-500 hover:bg-rose-500/10 transition" title="Hapus / Buang Kategori '${kat}'">

    window.tambahKategoriBaru = function (e) {
      e.preventDefault();
      const name = (document.getElementById('new-kat-name')?.value || '').trim();
      if (!name) return;
      if (!state.kategoriStok) state.kategoriStok = ['Tinta', 'Sparepart', 'Barang'];
      const exists = state.kategoriStok.some(k => k.toLowerCase() === name.toLowerCase());
      if (exists) {
        alert(`Kategori "${name}" sudah ada dalam daftar!`);
        return;
      }
      state.kategoriStok.push(name);
      persistLocalStorageData();
      openKelolaKategoriModal();
      renderPage();
    };

    window.hapusKategori = function (katName) {
      const count = state.stok.filter(s => s.kategori && s.kategori.toLowerCase() === katName.toLowerCase()).length;
      let msg = `Yakin ingin menghapus / membuang kategori "${katName}"?`;
      if (count > 0) {
        msg = `Kategori "${katName}" sedang digunakan oleh ${count} item barang di stok!\n\nJika dihapus, kategori pada ${count} barang tersebut akan diubah menjadi "Lainnya".\n\nLanjutkan menghapus?`;
      }
      if (confirm(msg)) {
        state.kategoriStok = (state.kategoriStok || []).filter(k => k.toLowerCase() !== katName.toLowerCase());
        if (count > 0) {
          state.stok.forEach(s => {
            if (s.kategori && s.kategori.toLowerCase() === katName.toLowerCase()) {
              s.kategori = 'Lainnya';
            }
          });
          if (!state.kategoriStok.some(k => k.toLowerCase() === 'lainnya')) {
            state.kategoriStok.push('Lainnya');
          }
        }
        if (state.stokFilterCat && state.stokFilterCat.toLowerCase() === katName.toLowerCase()) {
          state.stokFilterCat = 'all';
        }
        persistLocalStorageData();
        openKelolaKategoriModal();
        renderPage();
      }
    };

    window.exportAllDataToExcel = function () {
      if (typeof XLSX === 'undefined') {
        alert('Library SheetJS (XLSX) belum selesai dimuat. Pastikan koneksi internet aktif.');
        return;
      }

      try {
        const wb = XLSX.utils.book_new();

        // 1. STOK BARANG
        const stokRows = (state.stok || []).map(s => ({
          'Kode ID': s.id,
          'Nama Barang': s.nama,
          'Kategori': s.kategori,
          'Satuan': s.satuan || 'Pcs',
          'HPP Modal (Rp)': Number(s.hpp) || 0,
          'Harga Jual (Rp)': Number(s.harga) || 0,
          'Jumlah Stok': Number(s.jumlah) || 0,
          'Batas Min Stok': Number(s.minStok) || 0
        }));
        const wsStok = XLSX.utils.json_to_sheet(stokRows);
        wsStok['!cols'] = [{ wch: 15 }, { wch: 36 }, { wch: 18 }, { wch: 12 }, { wch: 18 }, { wch: 18 }, { wch: 14 }, { wch: 16 }];
        XLSX.utils.book_append_sheet(wb, wsStok, 'Stok_Barang');

        // 2. DATA PELANGGAN
        const custRows = (state.pelanggan || []).map(p => ({
          'ID Pelanggan': p.id,
          'Nama Pelanggan': p.nama,
          'No Telepon': p.telepon || '',
          'Alamat': p.alamat || ''
        }));
        const wsCust = XLSX.utils.json_to_sheet(custRows);
        wsCust['!cols'] = [{ wch: 16 }, { wch: 28 }, { wch: 20 }, { wch: 40 }];
        XLSX.utils.book_append_sheet(wb, wsCust, 'Data_Pelanggan');

        // 3. KATEGORI STOK
        const katRows = (getKategoriStokList() || []).map(k => ({
          'Nama Kategori': k
        }));
        const wsKat = XLSX.utils.json_to_sheet(katRows);
        wsKat['!cols'] = [{ wch: 25 }];
        XLSX.utils.book_append_sheet(wb, wsKat, 'Kategori_Stok');

        // 4. TRANSAKSI SERVIS
        const srvRows = (state.servis || []).map(s => {
          const spSummary = (s.spareparts || []).map(sp => `${sp.nama} (${sp.qty}x @${sp.harga})`).join('; ');
          return {
            'ID Servis': s.id,
            'Tanggal': s.tanggal,
            'ID Pelanggan': s.pelangganId || '',
            'Nama Pelanggan': s.pelangganNama || '',
            'No Telepon': s.pelangganTelepon || '',
            'Alamat': s.pelangganAlamat || '',
            'Tipe Printer': s.printer || '',
            'Kelengkapan': s.kelengkapan || '',
            'Keluhan Kerusakan': s.keluhan || '',
            'Status Servis': s.status || '',
            'Biaya Jasa (Rp)': Number(s.biayaJasa) || 0,
            'Total Biaya (Rp)': Number(s.totalBiaya) || 0,
            'Status Bayar': s.statusBayar || '',
            'Bayar / DP (Rp)': Number(s.bayar) || 0,
            'Sisa Tagihan (Rp)': Number(s.sisa) || 0,
            'Ringkasan Sparepart': spSummary,
            'Raw Spareparts JSON': JSON.stringify(s.spareparts || [])
          };
        });
        const wsSrv = XLSX.utils.json_to_sheet(srvRows);
        wsSrv['!cols'] = [{ wch: 16 }, { wch: 14 }, { wch: 16 }, { wch: 24 }, { wch: 18 }, { wch: 30 }, { wch: 20 }, { wch: 20 }, { wch: 30 }, { wch: 18 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 35 }, { wch: 40 }];
        XLSX.utils.book_append_sheet(wb, wsSrv, 'Transaksi_Servis');

        // 5. PENJUALAN POS
        const posRows = (state.penjualan || []).map(p => {
          const itemSummary = (p.items || []).map(i => `${i.nama} (${i.qty}x @${i.harga})`).join('; ');
          return {
            'ID Transaksi': p.id,
            'Tanggal': p.tanggal,
            'Pelanggan': p.pelangganNama || 'Umum / Cash',
            'Metode Bayar': p.metode || 'Tunai',
            'Total Omset (Rp)': Number(p.total) || 0,
            'Total HPP Modal (Rp)': Number(p.hppTotal) || 0,
            'Laba Kotor (Rp)': Number(p.labaKotor) || 0,
            'Ringkasan Barang': itemSummary,
            'Raw Items JSON': JSON.stringify(p.items || [])
          };
        });
        const wsPos = XLSX.utils.json_to_sheet(posRows);
        wsPos['!cols'] = [{ wch: 16 }, { wch: 14 }, { wch: 22 }, { wch: 16 }, { wch: 18 }, { wch: 18 }, { wch: 18 }, { wch: 35 }, { wch: 40 }];
        XLSX.utils.book_append_sheet(wb, wsPos, 'Penjualan_POS');

        // 6. PEMBELIAN STOK
        const buyRows = (state.pembelian || []).map(b => ({
          'ID Pembelian': b.id,
          'Tanggal': b.tanggal,
          'Supplier': b.supplier,
          'Deskripsi Barang': b.barang,
          'Total (Rp)': Number(b.total) || 0,
          'Status': b.status
        }));
        const wsBuy = XLSX.utils.json_to_sheet(buyRows);
        wsBuy['!cols'] = [{ wch: 16 }, { wch: 14 }, { wch: 28 }, { wch: 32 }, { wch: 18 }, { wch: 16 }];
        XLSX.utils.book_append_sheet(wb, wsBuy, 'Pembelian_Stok');

        // 7. KAS MASUK & KELUAR
        const kasRows = (state.kas || []).map(k => ({
          'ID Kas': k.id,
          'Tanggal': k.tanggal,
          'Tipe Kas': k.tipe,
          'Kategori': k.kategori,
          'Jumlah (Rp)': Number(k.jumlah) || 0,
          'Keterangan': k.keterangan || ''
        }));
        const wsKas = XLSX.utils.json_to_sheet(kasRows);
        wsKas['!cols'] = [{ wch: 16 }, { wch: 14 }, { wch: 14 }, { wch: 20 }, { wch: 18 }, { wch: 35 }];
        XLSX.utils.book_append_sheet(wb, wsKas, 'Kas_Masuk_Keluar');

        // 8. PENGELUARAN OPERASIONAL
        const opsRows = (state.operasional || []).map(o => ({
          'ID Operasional': o.id,
          'Tanggal': o.tanggal,
          'Nama Pengeluaran': o.nama,
          'Jumlah (Rp)': Number(o.jumlah) || 0,
          'Keterangan': o.kete || ''
        }));
        const wsOps = XLSX.utils.json_to_sheet(opsRows);
        wsOps['!cols'] = [{ wch: 16 }, { wch: 14 }, { wch: 25 }, { wch: 18 }, { wch: 35 }];
        XLSX.utils.book_append_sheet(wb, wsOps, 'Pengeluaran_Operasional');

        // 9. HUTANG & PIUTANG
        const hpRows = (state.hutangpiutang || []).map(h => ({
          'ID Catatan': h.id,
          'Jenis': h.jenis,
          'Pihak Terkait': h.pihak,
          'No Referensi': h.noRef || '',
          'Nominal (Rp)': Number(h.jumlah) || 0,
          'Jatuh Tempo': h.jatuhTempo || '',
          'Status': h.status
        }));
        const wsHp = XLSX.utils.json_to_sheet(hpRows);
        wsHp['!cols'] = [{ wch: 16 }, { wch: 14 }, { wch: 25 }, { wch: 18 }, { wch: 18 }, { wch: 16 }, { wch: 16 }];
        XLSX.utils.book_append_sheet(wb, wsHp, 'Hutang_Piutang');

        const now = new Date();
        const dateStr = now.toISOString().slice(0, 10);
        const timeStr = `${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}`;
        const fileName = `Backup_JoyPrintSolution_${dateStr}_${timeStr}.xlsx`;

        XLSX.writeFile(wb, fileName);
        showNotificationToast(`File backup lengkap "${fileName}" berhasil diunduh!`);
      } catch (err) {
        console.error('Export Excel Error:', err);
        alert('Gagal mengekspor file Excel: ' + err.message);
      }
    };
