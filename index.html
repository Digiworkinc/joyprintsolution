<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joy Print Solution - Management & POS System</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- SheetJS (xlsx) for Excel import/export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfeff',
              100: '#cffafe',
              500: '#06b6d4',
              600: '#0891b2',
              700: '#0e7490',
              800: '#155e75',
              900: '#164e63',
              darkBg: '#0f172a',
              darkCard: '#1e293b'
            }
          }
        }
      }
    }
  </script>
  <style>
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-area, #printable-area * {
        visibility: visible;
      }
      #printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .no-print {
        display: none !important;
      }
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
    }
    .dark ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <div id="app" class="flex flex-1 h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col justify-between z-20 shrink-0 transition-all duration-300">
      <div>
        <!-- Brand Header -->
        <div class="p-4 flex items-center justify-between border-b border-slate-200 dark:border-slate-700">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-cyan-500 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-cyan-500/30">
              <i data-lucide="printer" class="w-6 h-6"></i>
            </div>
            <div>
              <h1 class="font-bold text-base leading-tight">Joy Print</h1>
              <span class="text-xs text-cyan-600 dark:text-cyan-400 font-semibold">Solution App</span>
            </div>
          </div>
        </div>

        <!-- Role Badge & Access Control -->
        <div class="p-4 mx-3 my-3 rounded-lg bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700/60 flex items-center justify-between">
          <div>
            <span class="text-xs text-slate-500 dark:text-slate-400 block">Hak Akses:</span>
            <span id="role-badge" class="font-bold text-sm text-cyan-500 capitalize">Admin</span>
          </div>
          <button onclick="switchRoleModal()" class="text-xs px-2.5 py-1 rounded bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 transition flex items-center space-x-1">
            <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
            <span>Ubah</span>
          </button>
        </div>

        <!-- Connection & Auto-Save Status Banner -->
        <div class="px-4 py-1.5 mx-3 mb-2 rounded text-[11px] font-medium flex items-center justify-between bg-emerald-500/10 text-emerald-500 border border-emerald-500/20" id="db-status">
          <span class="flex items-center space-x-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" id="db-status-dot"></span>
            <span id="db-status-text">Local Storage Active</span>
          </span>
          <i data-lucide="hard-drive" class="w-3.5 h-3.5"></i>
        </div>

        <!-- Excel Backup & Restore Bar -->
        <div class="px-3 mb-2 flex space-x-1">
          <button onclick="exportToExcel()" class="flex-1 py-1.5 px-2 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 rounded text-xs font-semibold flex items-center justify-center space-x-1 transition" title="Backup ke file Excel">
            <i data-lucide="download" class="w-3.5 h-3.5"></i>
            <span>Export</span>
          </button>
          <label class="flex-1 py-1.5 px-2 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-600 dark:text-cyan-400 rounded text-xs font-semibold flex items-center justify-center space-x-1 cursor-pointer transition" title="Restore dari file Excel">
            <i data-lucide="upload" class="w-3.5 h-3.5"></i>
            <span>Import</span>
            <input type="file" id="import-excel-file" accept=".xlsx, .xls" onchange="importFromExcel(event)" class="hidden" />
          </label>
        </div>

        <!-- Navigation Links -->
        <nav class="p-3 space-y-1 overflow-y-auto max-h-[calc(100vh-290px)]" id="main-nav">
          <!-- Rendered via JS based on Role -->
        </nav>
      </div>

      <!-- Bottom Settings & Theme Switcher -->
      <div class="p-3 border-t border-slate-200 dark:border-slate-700 space-y-2">
        <button onclick="toggleDarkMode()" class="w-full flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700/50 transition">
          <div class="flex items-center space-x-2">
            <i data-lucide="moon" class="w-5 h-5 hidden dark:block text-amber-400"></i>
            <i data-lucide="sun" class="w-5 h-5 block dark:hidden text-amber-500"></i>
            <span class="text-sm font-medium">Tampilan</span>
          </div>
          <span class="text-xs px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 capitalize" id="theme-label">Dark</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
      <!-- Top Navigation Header -->
      <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-6 z-10 shrink-0">
        <div class="flex items-center space-x-4">
          <button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 md:hidden">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <h2 id="page-title" class="text-lg font-bold text-slate-800 dark:text-slate-100">Dashboard Utama</h2>
        </div>

        <div class="flex items-center space-x-3">
          <!-- Low Stock Indicator Alert -->
          <button onclick="navigateTo('stok')" class="relative p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300" title="Peringatan Stok Tipis">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span id="low-stock-count" class="hidden absolute top-1 right-1 w-4 h-4 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center">0</span>
          </button>

          <!-- Quick Action POS Button -->
          <button onclick="navigateTo('pos')" class="px-3.5 py-1.5 rounded-lg bg-cyan-500 hover:bg-cyan-600 text-white text-sm font-semibold flex items-center space-x-2 shadow-md shadow-cyan-500/20 transition">
            <i data-lucide="shopping-cart" class="w-4 h-4"></i>
            <span>Kasir / POS</span>
          </button>
        </div>
      </header>

      <!-- Dynamic Page Container -->
      <main id="content-area" class="flex-1 p-6 overflow-y-auto bg-slate-50 dark:bg-slate-900">
        <!-- Content dynamic injection -->
      </main>
    </div>
  </div>

  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div id="modal-box" class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto p-6 transition-all scale-95 opacity-0 relative">
      <!-- Dynamic Modal Content -->
    </div>
  </div>

  <!-- Custom Alert / Message Modal -->
  <div id="custom-alert-backdrop" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-2xl w-full max-w-sm p-6 text-center space-y-4">
      <div id="custom-alert-icon" class="w-12 h-12 rounded-full bg-cyan-500/10 text-cyan-500 mx-auto flex items-center justify-center">
        <i data-lucide="info" class="w-6 h-6"></i>
      </div>
      <h3 id="custom-alert-title" class="font-bold text-lg text-slate-800 dark:text-slate-100">Informasi</h3>
      <p id="custom-alert-message" class="text-sm text-slate-500 dark:text-slate-400"></p>
      <div id="custom-alert-actions" class="flex justify-center space-x-2 pt-2">
        <button onclick="closeCustomAlert()" class="w-full py-2.5 bg-cyan-500 hover:bg-cyan-600 text-white rounded-xl font-bold text-sm transition">OK</button>
      </div>
    </div>
  </div>

  <!-- Area Cetak Tersembunyi -->
  <div id="printable-area" class="hidden p-6 bg-white text-black font-mono">
    <!-- Render Cetak Struk / Nota -->
  </div>

  <script>
    const initialSeedData = {
      pelanggan: [
        { id: 'CUST-001', nama: 'Budi Santoso', telepon: '08123456789', alamat: 'Jl. Merdeka No. 12, Kota' },
        { id: 'CUST-002', nama: 'CV Media Utama', telepon: '08567890123', alamat: 'Kawasan Industri Block C' },
        { id: 'CUST-003', nama: 'Toko Sumber Rejeki', telepon: '08781234567', alamat: 'Jl. Ahmad Yani No. 45' }
      ],
      stok: [
        { id: 'BRG-001', nama: 'Tinta Epson 003 Black', kategori: 'Tinta', hpp: 75000, harga: 95000, jumlah: 15, minStok: 5, satuan: 'Botol' },
        { id: 'BRG-002', nama: 'Tinta Canon 790 Black', kategori: 'Tinta', hpp: 80000, harga: 105000, jumlah: 3, minStok: 5, satuan: 'Botol' },
        { id: 'BRG-003', nama: 'Printhead Epson L3110', kategori: 'Sparepart', hpp: 450000, harga: 580000, jumlah: 2, minStok: 2, satuan: 'Pcs' },
        { id: 'BRG-004', nama: 'Roller Paper Pickup Canon IP2770', kategori: 'Sparepart', hpp: 15000, harga: 35000, jumlah: 8, minStok: 3, satuan: 'Pcs' },
        { id: 'BRG-005', nama: 'Kertas HVS A4 75gr PaperOne', kategori: 'Barang', hpp: 42000, harga: 52000, jumlah: 25, minStok: 10, satuan: 'Rim' }
      ],
      servis: [
        { 
          id: 'SRV-2026-001', 
          tanggal: '2026-08-28', 
          pelangganId: 'CUST-001', 
          pelangganNama: 'Budi Santoso', 
          printer: 'Epson L3110', 
          keluhan: 'Hasil cetak garis-garis & mati total', 
          status: 'Menunggu Sparepart', 
          biayaJasa: 100000,
          spareparts: [{ id: 'BRG-003', nama: 'Printhead Epson L3110', harga: 580000, qty: 1 }],
          totalBiaya: 680000,
          statusBayar: 'DP',
          bayar: 200000,
          sisa: 480000
        },
        { 
          id: 'SRV-2026-002', 
          tanggal: '2026-08-30', 
          pelangganId: 'CUST-002', 
          pelangganNama: 'CV Media Utama', 
          printer: 'Canon IP2770', 
          keluhan: 'Paper Jam terus menerus', 
          status: 'Selesai', 
          biayaJasa: 75000,
          spareparts: [{ id: 'BRG-004', nama: 'Roller Paper Pickup Canon IP2770', harga: 35000, qty: 1 }],
          totalBiaya: 110000,
          statusBayar: 'Lunas',
          bayar: 110000,
          sisa: 0
        }
      ],
      penjualan: [
        {
          id: 'TRX-2026-001',
          tanggal: '2026-08-30',
          pelangganNama: 'Umum / Cash',
          items: [{ id: 'BRG-001', nama: 'Tinta Epson 003 Black', harga: 95000, qty: 2, subtotal: 190000, hpp: 75000 }],
          total: 190000,
          hppTotal: 150000,
          labaKotor: 40000,
          metode: 'Tunai'
        }
      ],
      pembelian: [
        { id: 'BUY-001', tanggal: '2026-08-25', supplier: 'Distributor Epson Resmi', barang: 'Tinta 003 & Head L3110', total: 1500000, status: 'Lunas' }
      ],
      kas: [
        { id: 'KAS-001', tanggal: '2026-08-31', tipe: 'Masuk', kategori: 'Modal Awal', keterangan: 'Setoran Kasir Pagi', jumlah: 500000 },
        { id: 'KAS-002', tanggal: '2026-08-31', tipe: 'Keluar', kategori: 'Operasional', keterangan: 'Beli Listrik Toko & Air Minum', jumlah: 150000 }
      ],
      operasional: [
        { id: 'OPS-001', tanggal: '2026-08-28', nama: 'Listrik & Internet', jumlah: 650000, kete: 'Bulanan Agustus' },
        { id: 'OPS-002', tanggal: '2026-08-31', nama: 'Konsumsi Teknisi', jumlah: 150000, kete: 'Snack & Kopi Toko' }
      ],
      hutangpiutang: [
        { id: 'HP-001', jenis: 'Piutang', pihak: 'Budi Santoso', noRef: 'SRV-2026-001', jumlah: 480000, jatuhTempo: '2026-09-05', status: 'Belum Lunas' },
        { id: 'HP-002', jenis: 'Hutang', pihak: 'Distributor Sparepart X', noRef: 'BUY-002', jumlah: 750000, jatuhTempo: '2026-09-10', status: 'Belum Lunas' }
      ]
    };

    window.state = {
      role: 'admin',
      activeTab: 'dashboard',
      darkMode: true,
      pelanggan: [],
      stok: [],
      servis: [],
      penjualan: [],
      pembelian: [],
      kas: [],
      operasional: [],
      hutangpiutang: [],
      cart: []
    };

    window.showAlert = function(message, title = "Informasi") {
      document.getElementById('custom-alert-title').innerText = title;
      document.getElementById('custom-alert-message').innerText = message;
      document.getElementById('custom-alert-backdrop').classList.remove('hidden');
    };

    window.closeCustomAlert = function() {
      document.getElementById('custom-alert-backdrop').classList.add('hidden');
    };

    window.loadAllData = function() {
      const collections = ['pelanggan', 'stok', 'servis', 'penjualan', 'pembelian', 'kas', 'operasional', 'hutangpiutang'];
      collections.forEach(colName => {
        const key = `joy-print-${colName}`;
        const stored = localStorage.getItem(key);
        if (!stored) {
          if (initialSeedData[colName]) {
            const seedObj = {};
            initialSeedData[colName].forEach(item => { seedObj[item.id] = item; });
            localStorage.setItem(key, JSON.stringify(seedObj));
          }
        }
        const dataStore = JSON.parse(localStorage.getItem(key) || '{}');
        window.state[colName] = Object.values(dataStore);
      });
    };

    window.saveCollectionItem = function(colName, docId, data) {
      const key = `joy-print-${colName}`;
      let store = JSON.parse(localStorage.getItem(key) || '{}');
      store[docId] = data;
      localStorage.setItem(key, JSON.stringify(store));
      window.state[colName] = Object.values(store);
      window.renderPage();
    };

    window.updateCollectionItem = function(colName, docId, data) {
      const key = `joy-print-${colName}`;
      let store = JSON.parse(localStorage.getItem(key) || '{}');
      if (store[docId]) {
        store[docId] = { ...store[docId], ...data };
        localStorage.setItem(key, JSON.stringify(store));
        window.state[colName] = Object.values(store);
        window.renderPage();
      }
    };

    window.deleteCollectionItem = function(colName, docId) {
      const key = `joy-print-${colName}`;
      let store = JSON.parse(localStorage.getItem(key) || '{}');
      delete store[docId];
      localStorage.setItem(key, JSON.stringify(store));
      window.state[colName] = Object.values(store);
      window.renderPage();
    };

    window.exportToExcel = function() {
      try {
        const wb = XLSX.utils.book_new();
        const collections = ['pelanggan', 'stok', 'servis', 'penjualan', 'pembelian', 'kas', 'operasional', 'hutangpiutang'];
        
        collections.forEach(colName => {
          const data = window.state[colName] || [];
          const cleanData = data.map(item => {
            let row = { ...item };
            if (row.items) row.items = JSON.stringify(row.items);
            if (row.spareparts) row.spareparts = JSON.stringify(row.spareparts);
            return row;
          });
          const ws = XLSX.utils.json_to_sheet(cleanData);
          XLSX.utils.book_append_sheet(wb, ws, colName.toUpperCase());
        });

        const todayStr = new Date().toISOString().split('T')[0];
        XLSX.writeFile(wb, `Joy_Print_Backup_${todayStr}.xlsx`);
        showAlert("Data berhasil diexport ke file Excel (.xlsx) dengan sukses!", "Backup Berhasil");
      } catch (err) {
        showAlert("Gagal melakukan export Excel: " + err.message, "Error");
      }
    };

    window.importFromExcel = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          
          workbook.SheetNames.forEach(sheetName => {
            const colName = sheetName.toLowerCase();
            const jsonSheet = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
            
            if (jsonSheet.length > 0) {
              const storeObj = {};
              jsonSheet.forEach(row => {
                if (row.items && typeof row.items === 'string') {
                  try { row.items = JSON.parse(row.items); } catch(e){}
                }
                if (row.spareparts && typeof row.spareparts === 'string') {
                  try { row.spareparts = JSON.parse(row.spareparts); } catch(e){}
                }
                if (row.id) {
                  storeObj[row.id] = row;
                }
              });
              localStorage.setItem(`joy-print-${colName}`, JSON.stringify(storeObj));
            }
          });

          window.loadAllData();
          window.renderPage();
          showAlert("Data berhasil diimport dan dimuat ulang otomatis ke sistem!", "Restore Berhasil");
        } catch (err) {
          showAlert("Format file Excel tidak valid atau rusak.", "Error Import");
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    };

    window.navItems = [
      { id: 'dashboard', label: 'Dashboard Utama', icon: 'layout-dashboard', roles: ['admin', 'user'] },
      { id: 'servis', label: 'Transaksi Servis', icon: 'wrench', roles: ['admin', 'user'] },
      { id: 'pos', label: 'Penjualan / POS', icon: 'shopping-bag', roles: ['admin', 'user'] },
      { id: 'stok', label: 'Stok Sparepart & Barang', icon: 'boxes', roles: ['admin', 'user'] },
      { id: 'pelanggan', label: 'Data Pelanggan', icon: 'users', roles: ['admin', 'user'] },
      { id: 'pembelian', label: 'Pembelian Stock', icon: 'truck', roles: ['admin'] },
      { id: 'kas', label: 'Kas Masuk & Keluar', icon: 'wallet', roles: ['admin', 'user'] },
      { id: 'operasional', label: 'Pengeluaran Operasional', icon: 'receipt', roles: ['admin'] },
      { id: 'hutangpiutang', label: 'Hutang & Piutang', icon: 'file-text', roles: ['admin'] },
      { id: 'laporan', label: 'Laporan Keuangan (70/20/10)', icon: 'bar-chart-3', roles: ['admin'] }
    ];

    window.formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);

    window.toggleDarkMode = function() {
      state.darkMode = !state.darkMode;
      const html = document.documentElement;
      if (state.darkMode) {
        html.classList.add('dark');
        document.getElementById('theme-label').innerText = 'Dark';
      } else {
        html.classList.remove('dark');
        document.getElementById('theme-label').innerText = 'Light';
      }
    };

    window.toggleSidebar = function() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('-translate-x-full');
    };

    window.switchRoleModal = function() {
      openModal(`
        <div class="space-y-4">
          <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center space-x-2">
            <i data-lucide="shield-alert" class="w-5 h-5 text-cyan-500"></i>
            <span>Ganti Hak Akses Pengguna</span>
          </h3>
          <p class="text-sm text-slate-500 dark:text-slate-400">Pilih mode hak akses aplikasi Joy Print Solution:</p>
          <div class="grid grid-cols-2 gap-3">
            <button onclick="setRole('admin')" class="p-4 rounded-xl border-2 ${state.role === 'admin' ? 'border-cyan-500 bg-cyan-500/10' : 'border-slate-200 dark:border-slate-700'} text-left hover:border-cyan-500 transition">
              <span class="font-bold block text-cyan-500">ADMIN</span>
              <span class="text-xs text-slate-500 dark:text-slate-400">Akses Penuh Seluruh Laporan, Operasional & Alokasi Pos</span>
            </button>
            <button onclick="setRole('user')" class="p-4 rounded-xl border-2 ${state.role === 'user' ? 'border-cyan-500 bg-cyan-500/10' : 'border-slate-200 dark:border-slate-700'} text-left hover:border-cyan-500 transition">
              <span class="font-bold block text-emerald-500">USER / KASIR</span>
              <span class="text-xs text-slate-500 dark:text-slate-400">Terbatas Servis, Kasir POS & Cek Stok</span>
            </button>
          </div>
        </div>
      `);
    };

    window.setRole = function(newRole) {
      state.role = newRole;
      document.getElementById('role-badge').innerText = newRole;
      document.getElementById('role-badge').className = `font-bold text-sm capitalize ${newRole === 'admin' ? 'text-cyan-500' : 'text-emerald-500'}`;
      
      const currentNav = navItems.find(n => n.id === state.activeTab);
      if (currentNav && !currentNav.roles.includes(newRole)) {
        state.activeTab = 'dashboard';
      }

      closeModal();
      renderNav();
      renderPage();
    };

    window.renderNav = function() {
      const navContainer = document.getElementById('main-nav');
      navContainer.innerHTML = navItems
        .filter(item => item.roles.includes(state.role))
        .map(item => `

    window.getFinancialMetrics = function() {
      const omsetPenjualan = state.penjualan.reduce((acc, curr) => acc + curr.total, 0);
      const omsetServis = state.servis.reduce((acc, curr) => acc + (curr.bayar || 0), 0);
      const totalOmset = omsetPenjualan + omsetServis;

      const hppPenjualan = state.penjualan.reduce((acc, curr) => acc + (curr.hppTotal || 0), 0);
      const hppSparepartServis = state.servis.reduce((acc, s) => {
        const hppItems = (s.spareparts || []).reduce((sum, sp) => {
          const itemMaster = state.stok.find(b => b.id === sp.id);
          return sum + ((itemMaster ? itemMaster.hpp : sp.harga * 0.7) * sp.qty);
        }, 0);
        return acc + hppItems;
      }, 0);
      const totalHPP = hppPenjualan + hppSparepartServis;

      const labaKotor = totalOmset - totalHPP;
      const totalOperasional = state.operasional.reduce((acc, curr) => acc + curr.jumlah, 0);
      const labaBersih = Math.max(0, labaKotor - totalOperasional);

      // Post A (70%), Post B (20%), Saving Money (10%)
      const postA = labaBersih * 0.70;
      const postB = labaBersih * 0.20;
      const savingMoney = labaBersih * 0.10;

      return {
        totalOmset,
        labaKotor,
        totalOperasional,
        labaBersih,
        postA,
        postB,
        savingMoney
      };
    };

    window.simpanServisBaru = function(e) {
      e.preventDefault();
      const pelangganId = document.getElementById('srv-pelanggan').value;
      const pel = state.pelanggan.find(p => p.id === pelangganId);
      const printer = document.getElementById('srv-printer').value;
      const keluhan = document.getElementById('srv-keluhan').value;
      const biayaJasa = parseFloat(document.getElementById('srv-jasa').value) || 0;
      const dp = parseFloat(document.getElementById('srv-dp').value) || 0;

      const newId = `SRV-2026-00${state.servis.length + 1}`;
      const totalBiaya = biayaJasa;
      const sisa = totalBiaya - dp;

      const newServis = {
        id: newId,
        tanggal: new Date().toISOString().split('T')[0],
        pelangganId,
        pelangganNama: pel ? pel.nama : 'Umum',
        printer,
        keluhan,
        status: 'Diterima',
        biayaJasa,
        spareparts: [],
        totalBiaya,
        statusBayar: sisa <= 0 ? 'Lunas' : (dp > 0 ? 'DP' : 'Belum Bayar'),
        bayar: dp,
        sisa: Math.max(0, sisa)
      };

      window.saveCollectionItem('servis', newId, newServis);

      if (sisa > 0) {
        const hpId = `HP-00${state.hutangpiutang.length + 1}`;
        window.saveCollectionItem('hutangpiutang', hpId, {
          id: hpId,
          jenis: 'Piutang',
          pihak: pel ? pel.nama : 'Pelanggan Servis',
          noRef: newId,
          jumlah: sisa,
          jatuhTempo: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
          status: 'Belum Lunas'
        });
      }

      closeModal();
    };

    window.addToCart = function(id) {
      const b = state.stok.find(item => item.id === id);
      if (!b || b.jumlah <= 0) {
        showAlert('Stok barang habis!');
        return;
      }
      const existing = state.cart.find(c => c.id === id);
      if (existing) {
        if (existing.qty < b.jumlah) {
          existing.qty += 1;
        } else {
          showAlert('Mencapai batas stok yang tersedia!');
        }
      } else {
        state.cart.push({ id: b.id, nama: b.nama, harga: b.harga, hpp: b.hpp, qty: 1 });
      }
      renderPage();
    };

    window.updateCartQty = function(idx, change) {
      const item = state.cart[idx];
      const stokItem = state.stok.find(b => b.id === item.id);
      item.qty += change;
      if (item.qty <= 0) {
        state.cart.splice(idx, 1);
      } else if (stokItem && item.qty > stokItem.jumlah) {
        item.qty = stokItem.jumlah;
        showAlert('Mencapai batas stok!');
      }
      renderPage();
    };

    window.prosesCheckoutPOS = function() {
      const total = state.cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      const hppTotal = state.cart.reduce((sum, item) => sum + (item.hpp * item.qty), 0);
      const trxId = `TRX-2026-00${state.penjualan.length + 1}`;

      const newPenjualan = {
        id: trxId,
        tanggal: new Date().toISOString().split('T')[0],
        pelangganNama: 'Umum / Cash',
        items: state.cart.map(i => ({ ...i, subtotal: i.harga * i.qty })),
        total,
        hppTotal,
        labaKotor: total - hppTotal,
        metode: 'Tunai'
      };

      for (const cartItem of state.cart) {
        const stokDoc = state.stok.find(s => s.id === cartItem.id);
        if (stokDoc) {
          const newQty = Math.max(0, stokDoc.jumlah - cartItem.qty);
          window.updateCollectionItem('stok', cartItem.id, { jumlah: newQty });
        }
      }

      window.saveCollectionItem('penjualan', trxId, newPenjualan);
      cetakNotaPOS(newPenjualan);

      state.cart = [];
      renderPage();
    };
