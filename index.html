    window.handleExcelFileUpload = function (event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      if (typeof XLSX === 'undefined') {
        alert('Library SheetJS (XLSX) belum selesai dimuat. Pastikan Anda terhubung ke internet.');
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          parseAndPreviewExcelWorkbook(wb, file.name);
        } catch (err) {
          console.error('Error parsing Excel:', err);
          alert('Gagal membaca file Excel. Pastikan file berformat .xlsx atau .xls yang valid.');
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    };

    window.parseAndPreviewExcelWorkbook = function (wb, fileName) {
      const getCol = (row, ...keys) => {
        for (const k of keys) {
          if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') {
            return row[k];
          }
          const normK = k.toLowerCase().replace(/[^a-z0-9]/g, '');
          for (const actualKey of Object.keys(row)) {
            if (actualKey.toLowerCase().replace(/[^a-z0-9]/g, '') === normK) {
              const val = row[actualKey];
              if (val !== undefined && val !== null && String(val).trim() !== '') {
                return val;
              }
            }
          }
        }
        return null;
      };

      const parseNum = (val, defaultVal = 0) => {
        if (val === undefined || val === null) return defaultVal;
        if (typeof val === 'number') return isNaN(val) ? defaultVal : val;
        let s = String(val).replace(/Rp|\.|\s/gi, '').replace(',', '.').trim();
        let n = parseFloat(s);
        return isNaN(n) ? defaultVal : n;
      };

      const parsed = {
        stok: [],
        pelanggan: [],
        kategoriStok: [],
        servis: [],
        penjualan: [],
        pembelian: [],
        kas: [],
        operasional: [],
        hutangpiutang: []
      };

      wb.SheetNames.forEach(sheetName => {
        const ws = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
        const sName = sheetName.toLowerCase().replace(/[^a-z]/g, '');

        if (sName.includes('stok') || sName.includes('barang') || sName.includes('sparepart') || sName.includes('item')) {
          rows.forEach((r, idx) => {
            const nama = getCol(r, 'Nama Barang', 'nama', 'Nama', 'Barang', 'Item', 'Deskripsi');
            if (!nama) return;
            const id = getCol(r, 'Kode ID', 'id', 'ID', 'Kode', 'Barcode') || `BRG-${String(state.stok.length + idx + 1).padStart(3, '0')}`;
            const kategori = getCol(r, 'Kategori', 'kategori', 'Category') || 'Barang';
            const satuan = getCol(r, 'Satuan', 'satuan', 'Unit') || 'Pcs';
            const hpp = parseNum(getCol(r, 'HPP Modal (Rp)', 'HPP Modal', 'hpp', 'HPP', 'Modal', 'cost'), 0);
            const harga = parseNum(getCol(r, 'Harga Jual (Rp)', 'Harga Jual', 'harga', 'Harga', 'price'), 0);
            const jumlah = parseInt(parseNum(getCol(r, 'Jumlah Stok', 'jumlah', 'Stok', 'qty', 'Qty', 'Stock'), 0));
            const minStok = parseInt(parseNum(getCol(r, 'Batas Min Stok', 'minStok', 'min', 'Min Stok'), 3));

            parsed.stok.push({
              id: String(id).trim(),
              nama: String(nama).trim(),
              kategori: String(kategori).trim(),
              satuan: String(satuan).trim(),
              hpp,
              harga,
              jumlah,
              minStok
            });
          });
        } else if (sName.includes('pelanggan') || sName.includes('customer') || sName.includes('cust') || sName.includes('kontak')) {
          rows.forEach((r, idx) => {
            const nama = getCol(r, 'Nama Pelanggan', 'nama', 'Nama', 'Customer', 'Client');
            if (!nama) return;
            const id = getCol(r, 'ID Pelanggan', 'id', 'ID', 'Kode') || `CUST-${String(state.pelanggan.length + idx + 1).padStart(3, '0')}`;
            const telepon = getCol(r, 'No Telepon', 'telepon', 'Telepon', 'No HP', 'No WA', 'HP', 'WA', 'Phone') || '';
            const alamat = getCol(r, 'Alamat', 'alamat', 'Address') || '';

            parsed.pelanggan.push({
              id: String(id).trim(),
              nama: String(nama).trim(),
              telepon: String(telepon).trim(),
              alamat: String(alamat).trim()
            });
          });
        } else if (sName.includes('kategori') || sName.includes('category')) {
          rows.forEach(r => {
            const kat = getCol(r, 'Nama Kategori', 'kategori', 'Kategori', 'Category');
            if (kat && typeof kat === 'string' && !parsed.kategoriStok.includes(kat.trim())) {
              parsed.kategoriStok.push(kat.trim());
            }
          });
        } else if (sName.includes('servis') || sName.includes('service')) {
          rows.forEach((r, idx) => {
            const id = getCol(r, 'ID Servis', 'id', 'ID', 'No Servis') || `SRV-${Date.now()}-${idx}`;
            const rawSP = getCol(r, 'Raw Spareparts JSON', 'spareparts');
            let sp = [];
            if (rawSP) {
              try { sp = JSON.parse(rawSP); } catch (e) { }
            }
            parsed.servis.push({
              id: String(id).trim(),
              tanggal: String(getCol(r, 'Tanggal', 'tanggal') || new Date().toISOString().slice(0, 10)),
              pelangganId: String(getCol(r, 'ID Pelanggan', 'pelangganId') || ''),
              pelangganNama: String(getCol(r, 'Nama Pelanggan', 'pelangganNama') || 'Pelanggan'),
              pelangganTelepon: String(getCol(r, 'No Telepon', 'pelangganTelepon') || ''),
              pelangganAlamat: String(getCol(r, 'Alamat', 'pelangganAlamat') || ''),
              printer: String(getCol(r, 'Tipe Printer', 'printer') || 'Printer'),
              kelengkapan: String(getCol(r, 'Kelengkapan', 'kelengkapan') || 'Unit'),
              keluhan: String(getCol(r, 'Keluhan Kerusakan', 'keluhan') || '-'),
              status: String(getCol(r, 'Status Servis', 'status') || 'Selesai'),
              biayaJasa: parseNum(getCol(r, 'Biaya Jasa (Rp)', 'biayaJasa', 'Biaya Jasa'), 0),
              spareparts: Array.isArray(sp) ? sp : [],
              totalBiaya: parseNum(getCol(r, 'Total Biaya (Rp)', 'totalBiaya', 'Total Biaya'), 0),
              statusBayar: String(getCol(r, 'Status Bayar', 'statusBayar') || 'Lunas'),
              bayar: parseNum(getCol(r, 'Bayar / DP (Rp)', 'bayar', 'Bayar'), 0),
              sisa: parseNum(getCol(r, 'Sisa Tagihan (Rp)', 'sisa', 'Sisa'), 0)
            });
          });
        } else if (sName.includes('penjualan') || sName.includes('pos') || sName.includes('transaksi') || sName.includes('sales')) {
          rows.forEach((r, idx) => {
            const id = getCol(r, 'ID Transaksi', 'id', 'ID', 'No Transaksi') || `TRX-${Date.now()}-${idx}`;
            const rawItems = getCol(r, 'Raw Items JSON', 'items');
            let items = [];
            if (rawItems) {
              try { items = JSON.parse(rawItems); } catch (e) { }
            }
            parsed.penjualan.push({
              id: String(id).trim(),
              tanggal: String(getCol(r, 'Tanggal', 'tanggal') || new Date().toISOString().slice(0, 10)),
              pelangganNama: String(getCol(r, 'Pelanggan', 'pelangganNama') || 'Umum / Cash'),
              metode: String(getCol(r, 'Metode Bayar', 'metode') || 'Tunai'),
              total: parseNum(getCol(r, 'Total Omset (Rp)', 'Total Belanja (Rp)', 'total'), 0),
              hppTotal: parseNum(getCol(r, 'Total HPP Modal (Rp)', 'hppTotal'), 0),
              labaKotor: parseNum(getCol(r, 'Laba Kotor (Rp)', 'labaKotor'), 0),
              items: Array.isArray(items) ? items : []
            });
          });
        } else if (sName.includes('pembelian') || sName.includes('buy') || sName.includes('purchase')) {
          rows.forEach((r, idx) => {
            const id = getCol(r, 'ID Pembelian', 'id', 'ID') || `BUY-${Date.now()}-${idx}`;
            parsed.pembelian.push({
              id: String(id).trim(),
              tanggal: String(getCol(r, 'Tanggal', 'tanggal') || new Date().toISOString().slice(0, 10)),
              supplier: String(getCol(r, 'Supplier', 'supplier') || 'Supplier'),
              barang: String(getCol(r, 'Deskripsi Barang', 'barang') || 'Barang'),
              total: parseNum(getCol(r, 'Total (Rp)', 'total'), 0),
              status: String(getCol(r, 'Status', 'status') || 'Lunas')
            });
          });
        } else if (sName.includes('kas') || sName.includes('cash')) {
          rows.forEach((r, idx) => {
            const id = getCol(r, 'ID Kas', 'id', 'ID') || `KAS-${Date.now()}-${idx}`;
            parsed.kas.push({
              id: String(id).trim(),
              tanggal: String(getCol(r, 'Tanggal', 'tanggal') || new Date().toISOString().slice(0, 10)),
              tipe: String(getCol(r, 'Tipe Kas', 'tipe') || 'Masuk'),
              kategori: String(getCol(r, 'Kategori', 'kategori') || 'Operasional'),
              jumlah: parseNum(getCol(r, 'Jumlah (Rp)', 'jumlah'), 0),
              keterangan: String(getCol(r, 'Keterangan', 'keterangan') || '')
            });
          });
        } else if (sName.includes('operasional') || sName.includes('ops') || sName.includes('expense') || sName.includes('beban')) {
          rows.forEach((r, idx) => {
            const id = getCol(r, 'ID Operasional', 'id', 'ID') || `OPS-${Date.now()}-${idx}`;
            parsed.operasional.push({
              id: String(id).trim(),
              tanggal: String(getCol(r, 'Tanggal', 'tanggal') || new Date().toISOString().slice(0, 10)),
              nama: String(getCol(r, 'Nama Pengeluaran', 'nama') || 'Beban'),
              jumlah: parseNum(getCol(r, 'Jumlah (Rp)', 'jumlah'), 0),
              kete: String(getCol(r, 'Keterangan', 'kete') || '')
            });
          });
        } else if (sName.includes('hutang') || sName.includes('piutang') || sName.includes('debt')) {
          rows.forEach((r, idx) => {
            const id = getCol(r, 'ID Catatan', 'id', 'ID') || `HP-${Date.now()}-${idx}`;
            parsed.hutangpiutang.push({
              id: String(id).trim(),
              jenis: String(getCol(r, 'Jenis', 'jenis') || 'Hutang'),
              pihak: String(getCol(r, 'Pihak Terkait', 'pihak') || 'Pihak'),
              noRef: String(getCol(r, 'No Referensi', 'noRef') || ''),
              jumlah: parseNum(getCol(r, 'Nominal (Rp)', 'jumlah'), 0),
              jatuhTempo: String(getCol(r, 'Jatuh Tempo', 'jatuhTempo') || ''),
              status: String(getCol(r, 'Status', 'status') || 'Belum Lunas')
            });
          });
        }
      });

      const totalRecords = Object.values(parsed).reduce((sum, arr) => sum + (arr ? arr.length : 0), 0);
      if (totalRecords === 0) {
        alert('Tidak ditemukan data yang sesuai dalam file Excel ini. Pastikan file berisikan sheet atau kolom yang sesuai format.');
        return;
      }

      window._pendingImportData = parsed;
      openImportPreviewModal(parsed, fileName);
    };

    window.executeImportData = async function () {
      if (!window._pendingImportData) return;
      const modeEl = document.querySelector('input[name="import-mode"]:checked');
      const mode = modeEl ? modeEl.value : 'merge';
      const data = window._pendingImportData;

      if (mode === 'replace') {
        if (data.stok.length > 0) state.stok = [...data.stok];
        if (data.pelanggan.length > 0) state.pelanggan = [...data.pelanggan];
        if (data.kategoriStok.length > 0) state.kategoriStok = [...data.kategoriStok];
        if (data.servis.length > 0) state.servis = [...data.servis];
        if (data.penjualan.length > 0) state.penjualan = [...data.penjualan];
        if (data.pembelian.length > 0) state.pembelian = [...data.pembelian];
        if (data.kas.length > 0) state.kas = [...data.kas];
        if (data.operasional.length > 0) state.operasional = [...data.operasional];
        if (data.hutangpiutang.length > 0) state.hutangpiutang = [...data.hutangpiutang];
      } else {
        const mergeCollection = (currentList, newList) => {
          const map = new Map();
          (currentList || []).forEach(item => map.set(item.id, item));
          (newList || []).forEach(item => map.set(item.id, { ...(map.get(item.id) || {}), ...item }));
          return Array.from(map.values());
        };

        if (data.stok.length > 0) state.stok = mergeCollection(state.stok, data.stok);
        if (data.pelanggan.length > 0) state.pelanggan = mergeCollection(state.pelanggan, data.pelanggan);
        if (data.kategoriStok.length > 0) {
          state.kategoriStok = Array.from(new Set([...(state.kategoriStok || []), ...data.kategoriStok]));
        }
        if (data.servis.length > 0) state.servis = mergeCollection(state.servis, data.servis);
        if (data.penjualan.length > 0) state.penjualan = mergeCollection(state.penjualan, data.penjualan);
        if (data.pembelian.length > 0) state.pembelian = mergeCollection(state.pembelian, data.pembelian);
        if (data.kas.length > 0) state.kas = mergeCollection(state.kas, data.kas);
        if (data.operasional.length > 0) state.operasional = mergeCollection(state.operasional, data.operasional);
        if (data.hutangpiutang.length > 0) state.hutangpiutang = mergeCollection(state.hutangpiutang, data.hutangpiutang);
      }

      persistLocalStorageData();

      if (isFirebaseActive && db) {
        try {
          const syncCol = async (colName, list) => {
            for (const item of list) {
              await setDoc(getDocRef(colName, item.id), item);
            }
          };
          await syncCol('stok', state.stok);
          await syncCol('pelanggan', state.pelanggan);
          await syncCol('servis', state.servis);
          await syncCol('penjualan', state.penjualan);
          await syncCol('pembelian', state.pembelian);
          await syncCol('kas', state.kas);
          await syncCol('operasional', state.operasional);
          await syncCol('hutangpiutang', state.hutangpiutang);
        } catch (err) {
          console.warn('Firebase sync error during import:', err);
        }
      }
