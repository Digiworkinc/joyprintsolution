<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joy Print Solution - Management & POS System</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfeff',
              100: '#cffafe',
              500: '#06b6d4',
              600: '#0891b2',
              700: '#0e7490',
              800: '#155e75',
              900: '#164e63',
              darkBg: '#0f172a',
              darkCard: '#1e293b'
            }
          }
        }
      }
    }
  </script>
  <style>
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-area, #printable-area * {
        visibility: visible;
      }
      #printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .no-print {
        display: none !important;
      }
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
    }
    .dark ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <div id="app" class="flex flex-1 h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col justify-between z-20 shrink-0 transition-all duration-300">
      <div>
        <!-- Brand Header -->
        <div class="p-4 flex items-center justify-between border-b border-slate-200 dark:border-slate-700">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-cyan-500 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-cyan-500/30">
              <i data-lucide="printer" class="w-6 h-6"></i>
            </div>
            <div>
              <h1 class="font-bold text-base leading-tight">Joy Print</h1>
              <span class="text-xs text-cyan-600 dark:text-cyan-400 font-semibold">Solution App</span>
            </div>
          </div>
        </div>

        <!-- Role Badge & Access Control -->
        <div class="p-4 mx-3 my-3 rounded-lg bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700/60 flex items-center justify-between">
          <div>
            <span class="text-xs text-slate-500 dark:text-slate-400 block">Hak Akses:</span>
            <span id="role-badge" class="font-bold text-sm text-cyan-500 capitalize">Admin</span>
          </div>
          <button onclick="switchRoleModal()" class="text-xs px-2.5 py-1 rounded bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 transition flex items-center space-x-1">
            <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
            <span>Ubah</span>
          </button>
        </div>

        <!-- Navigation Links -->
        <nav class="p-3 space-y-1 overflow-y-auto max-h-[calc(100vh-220px)]" id="main-nav">
          <!-- Rendered via JS based on Role -->
        </nav>
      </div>

      <!-- Bottom Settings & Theme Switcher -->
      <div class="p-3 border-t border-slate-200 dark:border-slate-700 space-y-2">
        <button onclick="toggleDarkMode()" class="w-full flex items-center justify-between p-2.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700/50 transition">
          <div class="flex items-center space-x-2">
            <i data-lucide="moon" class="w-5 h-5 hidden dark:block text-amber-400"></i>
            <i data-lucide="sun" class="w-5 h-5 block dark:hidden text-amber-500"></i>
            <span class="text-sm font-medium">Tampilan</span>
          </div>
          <span class="text-xs px-2 py-0.5 rounded bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 capitalize" id="theme-label">Dark</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
      <!-- Top Navigation Header -->
      <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-6 z-10 shrink-0">
        <div class="flex items-center space-x-4">
          <button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 md:hidden">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <h2 id="page-title" class="text-lg font-bold text-slate-800 dark:text-slate-100">Dashboard Utama</h2>
        </div>

        <div class="flex items-center space-x-3">
          <!-- Low Stock Indicator Alert -->
          <button onclick="navigateTo('stok')" class="relative p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300" title="Peringatan Stok Tipis">

          </button>

          <!-- Quick Action POS Button -->
          <button onclick="navigateTo('pos')" class="px-3.5 py-1.5 rounded-lg bg-cyan-500 hover:bg-cyan-600 text-white text-sm font-semibold flex items-center space-x-2 shadow-md shadow-cyan-500/20 transition">
            <i data-lucide="shopping-cart" class="w-4 h-4"></i>
            <span>Kasir / POS</span>

        </div>
      </header>

      <!-- Dynamic Page Container -->
      <main id="content-area" class="flex-1 p-6 overflow-y-auto bg-slate-50 dark:bg-slate-900">
        <!-- Content dynamic injection -->
      </main>
    </div>
  </div>

  <!-- Modal Container Dynamic -->
  <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div id="modal-box" class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto p-6 transition-all scale-95 opacity-0">
      <!-- Dynamic Modal Content -->
    </div>
  </div>

  <!-- Area Cetak Tersembunyi -->
  <div id="printable-area" class="hidden p-6 bg-white text-black font-mono">
    <!-- Render Cetak Struk / Nota -->
  </div>

  <script>
    // =========================================================================
    // STATE MANAGEMENT & LOCAL DATA
    // =========================================================================
    const state = {
      role: 'admin', // 'admin' atau 'user'
      activeTab: 'dashboard',
      darkMode: true,
      
      // Master Data
      pelanggan: [
        { id: 'CUST-001', nama: 'Budi Santoso', telepon: '08123456789', alamat: 'Jl. Merdeka No. 12, Kota' },
        { id: 'CUST-002', nama: 'CV Media Utama', telepon: '08567890123', alamat: 'Kawasan Industri Block C' },

      stok: [

        { id: 'BRG-002', nama: 'Tinta Canon 790 Black', kategori: 'Tinta', hpp: 80000, harga: 105000, jumlah: 3, minStok: 5, satuan: 'Botol' },

      ],

          printer: 'Canon IP2770', 
          keluhan: 'Paper Jam terus menerus', 
          status: 'Selesai', 
          biayaJasa: 75000,
          spareparts: [{ id: 'BRG-004', nama: 'Roller Paper Pickup Canon IP2770', harga: 35000, qty: 1 }],
          totalBiaya: 110000,
          statusBayar: 'Lunas',
          bayar: 110000,
          sisa: 0
        }
      ],

      penjualan: [
        {
          id: 'TRX-2026-001',
          tanggal: '2026-08-30',
          pelangganNama: 'Umum / Cash',
          items: [{ id: 'BRG-001', nama: 'Tinta Epson 003 Black', harga: 95000, qty: 2, subtotal: 190000, hpp: 75000 }],
          total: 190000,
          hppTotal: 150000,
          labaKotor: 40000,
          metode: 'Tunai'
        }
      ],

      pembelian: [
        { id: 'BUY-001', tanggal: '2026-08-25', supplier: 'Distributor Epson Resmi', barang: 'Tinta 003 & Head L3110', total: 1500000, status: 'Lunas' }
      ],

      kas: [
        { id: 'KAS-001', tanggal: '2026-08-31', tipe: 'Masuk', kategori: 'Modal Awal', keterangan: 'Setoran Kasir Pagi', jumlah: 500000 },
        { id: 'KAS-002', tanggal: '2026-08-31', tipe: 'Keluar', kategori: 'Operasional', keterangan: 'Beli Listrik Toko & Air Minum', jumlah: 150000 }
      ],

      operasional: [
        { id: 'OPS-001', tanggal: '2026-08-28', nama: 'Listrik & Internet', jumlah: 650000, kete: 'Bulanan Agustus' },
        { id: 'OPS-002', tanggal: '2026-08-31', nama: 'Konsumsi Teknisi', jumlah: 150000, kete: 'Snack & Kopi Toko' }
      ],

      hutangPiutang: [
        { id: 'HP-001', jenis: 'Piutang', pihak: 'Budi Santoso', noRef: 'SRV-2026-001', jumlah: 480000, jatuhTempo: '2026-09-05', status: 'Belum Lunas' },
        { id: 'HP-002', jenis: 'Hutang', pihak: 'Distributor Sparepart X', noRef: 'BUY-002', jumlah: 750000, jatuhTempo: '2026-09-10', status: 'Belum Lunas' }
      ],

      // Keranjang POS Sementara
      cart: []
    };

    // Navigasi Item Config Berdasarkan Role
    const navItems = [
      { id: 'dashboard', label: 'Dashboard Utama', icon: 'layout-dashboard', roles: ['admin', 'user'] },
      { id: 'servis', label: 'Transaksi Servis', icon: 'wrench', roles: ['admin', 'user'] },
      { id: 'pos', label: 'Penjualan / POS', icon: 'shopping-bag', roles: ['admin', 'user'] },
      { id: 'stok', label: 'Stok Sparepart & Barang', icon: 'boxes', roles: ['admin', 'user'] },
      { id: 'pelanggan', label: 'Data Pelanggan', icon: 'users', roles: ['admin', 'user'] },
      { id: 'pembelian', label: 'Pembelian Stock', icon: 'truck', roles: ['admin'] },
      { id: 'kas', label: 'Kas Masuk & Keluar', icon: 'wallet', roles: ['admin', 'user'] },
      { id: 'operasional', label: 'Pengeluaran Operasional', icon: 'receipt', roles: ['admin'] },
      { id: 'hutangpiutang', label: 'Hutang & Piutang', icon: 'file-text', roles: ['admin'] },
      { id: 'laporan', label: 'Laporan Keuangan', icon: 'bar-chart-3', roles: ['admin'] }
    ];

    // =========================================================================
    // HELPER FUNCTIONS
    // =========================================================================
    const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);

    function toggleDarkMode() {
      state.darkMode = !state.darkMode;
      const html = document.documentElement;
      if (state.darkMode) {
        html.classList.add('dark');
        document.getElementById('theme-label').innerText = 'Dark';
      } else {
        html.classList.remove('dark');
        document.getElementById('theme-label').innerText = 'Light';
      }
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('-translate-x-full');
    }

    function switchRoleModal() {
      openModal(`
        <div class="space-y-4">
          <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center space-x-2">
            <i data-lucide="shield-alert" class="w-5 h-5 text-cyan-500"></i>
            <span>Ganti Hak Akses Pengguna</span>
          </h3>
          <p class="text-sm text-slate-500 dark:text-slate-400">Pilih mode hak akses aplikasi Joy Print Solution:</p>
          <div class="grid grid-cols-2 gap-3">
            <button onclick="setRole('admin')" class="p-4 rounded-xl border-2 ${state.role === 'admin' ? 'border-cyan-500 bg-cyan-500/10' : 'border-slate-200 dark:border-slate-700'} text-left hover:border-cyan-500 transition">
              <span class="font-bold block text-cyan-500">ADMIN</span>
              <span class="text-xs text-slate-500 dark:text-slate-400">Akses Penuh Seluruh Laporan, Operasional & Laba</span>
            </button>
            <button onclick="setRole('user')" class="p-4 rounded-xl border-2 ${state.role === 'user' ? 'border-cyan-500 bg-cyan-500/10' : 'border-slate-200 dark:border-slate-700'} text-left hover:border-cyan-500 transition">
              <span class="font-bold block text-emerald-500">USER / KASIR</span>
              <span class="text-xs text-slate-500 dark:text-slate-400">Terbatas Servis, Kasir POS & Cek Stok</span>
            </button>
          </div>
        </div>
      `);
    }

    function setRole(newRole) {
      state.role = newRole;
      document.getElementById('role-badge').innerText = newRole;
      document.getElementById('role-badge').className = `font-bold text-sm capitalize ${newRole === 'admin' ? 'text-cyan-500' : 'text-emerald-500'}`;
      
      // Jika user saat ini di halaman terbatas admin, kembalikan ke dashboard
      const currentNav = navItems.find(n => n.id === state.activeTab);
      if (currentNav && !currentNav.roles.includes(newRole)) {
        state.activeTab = 'dashboard';
      }

      closeModal();
      renderNav();
      renderPage();
    }

    function renderNav() {
      const navContainer = document.getElementById('main-nav');
      navContainer.innerHTML = navItems
        .filter(item => item.roles.includes(state.role))
        .map(item => `
          <button onclick="navigateTo('${item.id}')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${state.activeTab === item.id ? 'bg-cyan-500 text-white shadow-md shadow-cyan-500/30' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50 hover:text-slate-900 dark:hover:text-slate-100'}">
            <i data-lucide="${item.icon}" class="w-4 h-4"></i>
            <span>${item.label}</span>
          </button>
        `).join('');
      lucide.createIcons();
    }

    function navigateTo(tabId) {
      state.activeTab = tabId;
      renderNav();
      renderPage();
    }

    function checkNotifications() {
      const lowStock = state.stok.filter(s => s.jumlah <= s.minStok).length;
      const countBadge = document.getElementById('low-stock-count');
      if (lowStock > 0) {
        countBadge.innerText = lowStock;
        countBadge.classList.remove('hidden');
      } else {
        countBadge.classList.add('hidden');
      }
    }

    // Modal Manager
    function openModal(contentHtml) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      box.innerHTML = contentHtml + `
        <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      `;
      backdrop.classList.remove('hidden');
      setTimeout(() => {
        box.classList.remove('scale-95', 'opacity-0');
        box.classList.add('scale-100', 'opacity-100');
      }, 10);
      lucide.createIcons();
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      box.classList.remove('scale-100', 'opacity-100');
      box.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        backdrop.classList.add('hidden');
      }, 200);
    }

    // =========================================================================
    // FINANCIAL CALCULATIONS ENGINE
    // =========================================================================
    function getFinancialMetrics() {
      // 1. Total Omset Penjualan POS + Transaksi Servis Lunas/DP
      const omsetPenjualan = state.penjualan.reduce((acc, curr) => acc + curr.total, 0);
      const omsetServis = state.servis.reduce((acc, curr) => acc + curr.bayar, 0);
      const totalOmset = omsetPenjualan + omsetServis;

      // 2. Total HPP Barang Jual + HPP Sparepart Terpakai
      const hppPenjualan = state.penjualan.reduce((acc, curr) => acc + (curr.hppTotal || 0), 0);
      const hppSparepartServis = state.servis.reduce((acc, s) => {
        const hppItems = s.spareparts.reduce((sum, sp) => {
          const itemMaster = state.stok.find(b => b.id === sp.id);
          return sum + ((itemMaster ? itemMaster.hpp : sp.harga * 0.7) * sp.qty);
        }, 0);
        return acc + hppItems;
      }, 0);
      const totalHPP = hppPenjualan + hppSparepartServis;

      // 3. Laba Kotor
      const labaKotor = totalOmset - totalHPP;

      // 4. Total Operasional
      const totalOperasional = state.operasional.reduce((acc, curr) => acc + curr.jumlah, 0);

      // 5. Laba Bersih
      const labaBersih = Math.max(0, labaKotor - totalOperasional);

      // 6. Pembagian Laba (3 Pos: 70%, 20%, 10%)
      const pos70 = labaBersih * 0.70; // Operational / Owner Profit
      const pos20 = labaBersih * 0.20; // Re-Investment & Restock
      const pos10 = labaBersih * 0.10; // Reserve / Bonus Team

      return {
        totalOmset,
        labaKotor,
        totalOperasional,
        labaBersih,
        pos70,
        pos20,
        pos10
      };
    }

    // =========================================================================
    // PAGE RENDERERS
    // =========================================================================
    function renderPage() {
      const container = document.getElementById('content-area');
      const title = document.getElementById('page-title');
      checkNotifications();

      const currentNav = navItems.find(n => n.id === state.activeTab);
      title.innerText = currentNav ? currentNav.label : 'Dashboard';

      switch (state.activeTab) {
        case 'dashboard':
          container.innerHTML = renderDashboardView();
          break;
        case 'servis':
          container.innerHTML = renderServisView();
          break;
        case 'pos':
          container.innerHTML = renderPOSView();
          break;
        case 'stok':
          container.innerHTML = renderStokView();
          break;
        case 'pelanggan':
          container.innerHTML = renderPelangganView();
          break;
        case 'pembelian':
          container.innerHTML = renderPembelianView();
          break;
        case 'kas':
          container.innerHTML = renderKasView();
          break;
        case 'operasional':
          container.innerHTML = renderOperasionalView();
          break;
        case 'hutangpiutang':
          container.innerHTML = renderHutangPiutangView();
          break;
        case 'laporan':
          container.innerHTML = renderLaporanView();
          break;
        default:
          container.innerHTML = renderDashboardView();
      }
      lucide.createIcons();
    }

    // --- 1. DASHBOARD VIEW ---

      return `

              <span class="text-xs font-semibold uppercase tracking-wider bg-white/20 px-3 py-1 rounded-full">Joy Print Solution Dashboard</span>
              <h2 class="text-2xl font-black mt-2">Selamat Datang di Sistem Management</h2>
              <p class="text-sm opacity-90 text-cyan-100">Solusi tepat servis printer, stok barang, dan pemantauan keuangan realtime.</p>
            </div>
            <div class="flex items-center space-x-3">
              <button onclick="navigateTo('servis')" class="px-4 py-2 bg-white text-cyan-700 rounded-xl font-bold text-sm shadow hover:bg-cyan-50 transition flex items-center space-x-2">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Servis Baru</span>
              </button>
            </div>
          </div>

          <!-- Financial Overview Cards -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="p-5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
              <div class="flex items-center justify-between text-slate-500">
                <span class="text-xs font-medium uppercase">Total Omset</span>
                <div class="p-2 rounded-lg bg-cyan-500/10 text-cyan-500"><i data-lucide="trending-up" class="w-5 h-5"></i></div>
              </div>
              <h3 class="text-2xl font-bold mt-2 text-slate-800 dark:text-slate-100">${formatRp(fin.totalOmset)}</h3>
              <p class="text-xs text-emerald-500 mt-1 flex items-center"><i data-lucide="arrow-up-right" class="w-3 h-3 mr-1"></i> Penjualan & Servis Terhitung</p>
            </div>

            <div class="p-5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm">
              <div class="flex items-center justify-between text-slate-500">
                <span class="text-xs font-medium uppercase">Laba Kotor</span>

    function simpanServisBaru(e) {
      e.preventDefault();
      const pelangganId = document.getElementById('srv-pelanggan').value;
      const pel = state.pelanggan.find(p => p.id === pelangganId);
      const printer = document.getElementById('srv-printer').value;
      const keluhan = document.getElementById('srv-keluhan').value;
      const biayaJasa = parseFloat(document.getElementById('srv-jasa').value) || 0;
      const dp = parseFloat(document.getElementById('srv-dp').value) || 0;

      const newId = `SRV-2026-00${state.servis.length + 1}`;
      const totalBiaya = biayaJasa;
      const sisa = totalBiaya - dp;

      state.servis.unshift({
        id: newId,
        tanggal: new Date().toISOString().split('T')[0],
        pelangganId,
        pelangganNama: pel ? pel.nama : 'Umum',
        printer,
        keluhan,
        status: 'Diterima',
        biayaJasa,
        spareparts: [],
        totalBiaya,
        statusBayar: sisa <= 0 ? 'Lunas' : (dp > 0 ? 'DP' : 'Belum Bayar'),
        bayar: dp,
        sisa: Math.max(0, sisa)
      });

      // Catat Piutang Jika Ada Sisa Pembayaran
      if (sisa > 0) {
        state.hutangPiutang.unshift({
          id: `HP-00${state.hutangPiutang.length + 1}`,
          jenis: 'Piutang',
          pihak: pel ? pel.nama : 'Pelanggan Servis',
          noRef: newId,
          jumlah: sisa,
          jatuhTempo: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
          status: 'Belum Lunas'
        });
      }

      closeModal();
      renderPage();
    }

      if (s) {

    }

    function addToCart(barangId) {
      const b = state.stok.find(item => item.id === barangId);
      if (!b || b.jumlah <= 0) {
        alert('Stok barang habis!');
        return;
      }
      const existing = state.cart.find(item => item.id === barangId);
      if (existing) {
        if (existing.qty + 1 > b.jumlah) {
          alert('Jumlah melebihi stok tersedia!');
          return;
        }
        existing.qty += 1;
      } else {
        state.cart.push({ id: b.id, nama: b.nama, harga: b.harga, hpp: b.hpp, qty: 1 });
      }
      renderPage();
    }

    function updateCartQty(idx, change) {
      const item = state.cart[idx];
      const b = state.stok.find(s => s.id === item.id);
      if (item) {
        item.qty += change;
        if (item.qty <= 0) {
          state.cart.splice(idx, 1);
        } else if (b && item.qty > b.jumlah) {
          alert('Mencapai batas stok tersedia!');
          item.qty = b.jumlah;
        }
      }
      renderPage();
    }

    function checkoutPOS() {
      if (state.cart.length === 0) return;

      const total = state.cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      const hppTotal = state.cart.reduce((sum, item) => sum + (item.hpp * item.qty), 0);

      const trxId = `TRX-2026-00${state.penjualan.length + 1}`;

      // Update Stock
      state.cart.forEach(c => {
        const b = state.stok.find(s => s.id === c.id);
        if (b) b.jumlah -= c.qty;
      });

      state.penjualan.unshift({
        id: trxId,
        tanggal: new Date().toISOString().split('T')[0],
        pelangganNama: 'Umum / Cash',
        items: [...state.cart],
        total,
        hppTotal,
        labaKotor: total - hppTotal,
        metode: 'Tunai'
      });

      // Cetak Thermal Receipt
      const printArea = document.getElementById('printable-area');
      printArea.innerHTML = `
        <div style="width: 280px; font-size: 11px; margin: 0 auto;">
          <h3 style="text-align:center; font-bold; margin:0;">JOY PRINT SOLUTION</h3>
          <p style="text-align:center; margin:0;">Struk Penjualan Sparepart</p>
          <hr style="border-top:1px dashed #000; margin:5px 0;" />
          <p>No: ${trxId}</p>
          <p>Tgl: ${new Date().toLocaleDateString('id-ID')}</p>
          <hr style="border-top:1px dashed #000; margin:5px 0;" />
          ${state.cart.map(i => `
            <div style="display:flex; justify-between;">
              <span>${i.nama} x${i.qty}</span>
              <span>${formatRp(i.harga * i.qty)}</span>
            </div>
          `).join('')}
          <hr style="border-top:1px dashed #000; margin:5px 0;" />
          <p style="display:flex; justify-content:space-between; font-weight:bold;"><span>TOTAL:</span> <span>${formatRp(total)}</span></p>
          <p style="text-align:center; margin-top:10px;">Terima Kasih!</p>
        </div>
      `;

      state.cart = [];
      renderPage();

      printArea.classList.remove('hidden');
      window.print();

            <label class="text-xs text-slate-500 block mb-1 font-semibold">Nama Pengeluaran</label>
            <input type="text" id="ops-nama" placeholder="Contoh: Listrik Bulanan / Wifi Toko" required class="w-full text-sm p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent" />
          </div>
          <div>
            <label class="text-xs text-slate-500 block mb-1 font-semibold">Keterangan</label>
            <input type="text" id="ops-ket" class="w-full text-sm p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent" />
          </div>
          <div>
            <label class="text-xs text-slate-500 block mb-1 font-semibold">Nominal Biaya (Rp)</label>
            <input type="number" id="ops-jumlah" required class="w-full text-sm p-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent" />
          </div>
          <div class="pt-3 border-t border-slate-200 dark:border-slate-700 flex justify-end space-x-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-200 dark:bg-slate-700">Batal</button>
            <button type="submit" class="px-4 py-2 rounded-xl text-sm font-semibold bg-cyan-500 text-white">Simpan Operasional</button>
          </div>
        </form>
      `);
    }

    function simpanOperasionalBaru(e) {
      e.preventDefault();
      const nama = document.getElementById('ops-nama').value;
      const kete = document.getElementById('ops-ket').value;
      const jumlah = parseFloat(document.getElementById('ops-jumlah').value) || 0;

      state.operasional.unshift({
        id: `OPS-00${state.operasional.length + 1}`,
        tanggal: new Date().toISOString().split('T')[0],
        nama,
        kete,
        jumlah
      });

      closeModal();
      renderPage();
    }

    // --- 9. HUTANG & PIUTANG VIEW (ADMIN) ---
    function renderHutangPiutangView() {
      return `
        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <div>
              <h3 class="text-xl font-bold">Buku Hutang & Piutang</h3>
              <p class="text-xs text-slate-500">Pencatatan kewajiban bayar & tagihan servis/barang pelanggan.</p>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900/40 text-xs text-slate-500 font-semibold uppercase">
                  <th class="p-4">Jenis</th>
                  <th class="p-4">Pihak (Nama)</th>
                  <th class="p-4">No. Referensi</th>
                  <th class="p-4">Tenggat Waktu</th>
                  <th class="p-4">Sisa Tagihan</th>
                  <th class="p-4">Status</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-200 dark:divide-slate-700 text-sm">
                ${state.hutangPiutang.map(hp => `
                  <tr>
                    <td class="p-4">
                      <span class="px-2 py-0.5 rounded text-xs font-bold ${hp.jenis === 'Piutang' ? 'bg-cyan-500/10 text-cyan-500' : 'bg-amber-500/10 text-amber-500'}">${hp.jenis}</span>
                    </td>
                    <td class="p-4 font-bold">${hp.pihak}</td>
                    <td class="p-4 font-mono text-xs text-slate-400">${hp.noRef}</td>
                    <td class="p-4 text-xs">${hp.jatuhTempo}</td>
                    <td class="p-4 font-bold text-rose-500">${formatRp(hp.jumlah)}</td>
                    <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-bold bg-rose-500/10 text-rose-500">${hp.status}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // --- 10. LAPORAN KEUANGAN VIEW (ADMIN) ---
    function renderLaporanView() {
      const fin = getFinancialMetrics();

      return `
        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <div>
              <h3 class="text-xl font-bold">Laporan Keuangan & Pembagian Laba</h3>
              <p class="text-xs text-slate-500">Rekapitulasi Omset, HPP, Laba Kotor, Operasional & Laba Bersih Pos.</p>
            </div>
            <button onclick="window.print()" class="px-4 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-xl font-bold text-sm flex items-center space-x-2 transition">
              <i data-lucide="printer" class="w-4 h-4"></i>
              <span>Cetak Laporan</span>

          <!-- Table Summary Laba Rugi -->

            <div class="space-y-2 text-sm">
              <div class="flex justify-between py-1 border-b border-slate-100 dark:border-slate-700/50">
                <span class="text-slate-500">Total Omset Penjualan & Servis</span>
                <span class="font-bold text-cyan-500">${formatRp(fin.totalOmset)}</span>
              </div>
              <div class="flex justify-between py-1 border-b border-slate-100 dark:border-slate-700/50">
                <span class="text-slate-500">Total HPP (Harga Pokok Penjualan/Sparepart)</span>
                <span class="font-bold text-rose-500">(${formatRp(fin.totalOmset - fin.labaKotor)})</span>
              </div>
              <div class="flex justify-between py-2 border-b-2 border-slate-200 dark:border-slate-700 font-bold">
                <span>LABA KOTOR</span>
                <span class="text-emerald-500">${formatRp(fin.labaKotor)}</span>
              </div>
              <div class="flex justify-between py-1 border-b border-slate-100 dark:border-slate-700/50">
                <span class="text-slate-500">Total Beban Operasional Toko</span>
                <span class="font-bold text-rose-500">(${formatRp(fin.totalOperasional)})</span>
              </div>
              <div class="flex justify-between py-3 font-black text-lg bg-slate-50 dark:bg-slate-900/60 p-3 rounded-xl">
                <span>LABA BERSIH (NET PROFIT)</span>
                <span class="text-amber-500">${formatRp(fin.labaBersih)}</span>
              </div>
            </div>
          </div>

          <!-- Profit Breakdown Pos 70:20:10 Card -->
          <div class="p-6 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
            <h4 class="font-bold text-base border-b border-slate-200 dark:border-slate-700 pb-3">Rincian Pembagian Laba 3 Pos</h4>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="p-4 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-500">
                <span class="text-xs font-bold uppercase block">Pos Operasional & Owner (70%)</span>
                <span class="text-2xl font-black mt-1 block">${formatRp(fin.pos70)}</span>
              </div>
              <div class="p-4 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-500">
                <span class="text-xs font-bold uppercase block">Pos Restock & Re-Investment (20%)</span>
                <span class="text-2xl font-black mt-1 block">${formatRp(fin.pos20)}</span>
              </div>
              <div class="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-500">
                <span class="text-xs font-bold uppercase block">Pos Cadangan & Bonus (10%)</span>
                <span class="text-2xl font-black mt-1 block">${formatRp(fin.pos10)}</span>

            </div>
          </div>
        </div>
      `;
    }

    // POS Filter Search
    function filterPOSItems(query) {
      const q = query.toLowerCase();
      const grid = document.getElementById('pos-grid');
      const filtered = state.stok.filter(b => b.nama.toLowerCase().includes(q) || b.kategori.toLowerCase().includes(q));
      
      grid.innerHTML = filtered.map(b => `
        <div onclick="addToCart('${b.id}')" class="p-3.5 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-cyan-500 cursor-pointer transition shadow-sm space-y-2 flex flex-col justify-between">
          <div>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-500 uppercase">${b.kategori}</span>
            <h4 class="font-bold text-sm text-slate-800 dark:text-slate-100 mt-1 line-clamp-2">${b.nama}</h4>
          </div>
          <div>
            <span class="text-xs text-slate-400 block font-normal">Stok: ${b.jumlah} ${b.satuan}</span>
            <span class="font-extrabold text-cyan-600 dark:text-cyan-400 text-sm">${formatRp(b.harga)}</span>
          </div>
        </div>
      `).join('');
    }

    // =========================================================================
    // APP INITIALIZATION
    // =========================================================================
    window.onload = function() {
      renderNav();
      renderPage();
    };
  </script>
</body>
