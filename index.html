    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfeff',
              100: '#cffafe',
              500: '#06b6d4',
              600: '#0891b2',
              700: '#0e7490',
              800: '#155e75',
              900: '#164e63',
              darkBg: '#0f172a',
              darkCard: '#1e293b'
            }
          }
        }
      }
    }
  </script>
  <style>
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-area, #printable-area * {
        visibility: visible;
      }
      #printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .no-print {
        display: none !important;
      }
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
    }
    .dark ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
    }
    /* Notification animations */
    @keyframes fadeOut {
      from {
        opacity: 1;
        transform: translateY(0);
      }
      to {
        opacity: 0;
        transform: translateY(-10px);
      }
    }
  </style>
</head>

  <script type="module">

        { id: 'BRG-004', nama: 'Roller Paper Pickup Canon IP2770', kategori: 'Sparepart', hpp: 15000, harga: 35000, jumlah: 8, minStok: 3, satuan: 'Pcs' },
        { id: 'BRG-005', nama: 'Kertas HVS A4 75gr PaperOne', kategori: 'Barang', hpp: 42000, harga: 52000, jumlah: 25, minStok: 10, satuan: 'Rim' }

        }
      ],
      penjualan: [
        {

      ],
      kas: [
        { id: 'KAS-001', tanggal: '2026-08-31', tipe: 'Masuk', kategori: 'Modal Awal', keterangan: 'Setoran Kasir Pagi', jumlah: 500000 },
        { id: 'KAS-002', tanggal: '2026-08-31', tipe: 'Keluar', kategori: 'Operasional', keterangan: 'Beli Listrik Toko & Air Minum', jumlah: 150000 }
      ],
      operasional: [
        { id: 'OPS-001', tanggal: '2026-08-28', nama: 'Listrik & Internet', jumlah: 650000, kete: 'Bulanan Agustus' },
        { id: 'OPS-002', tanggal: '2026-08-31', nama: 'Konsumsi Teknisi', jumlah: 150000, kete: 'Snack & Kopi Toko' }
      ],
      hutangpiutang: [
        { id: 'HP-001', jenis: 'Piutang', pihak: 'Budi Santoso', noRef: 'SRV-2026-001', jumlah: 480000, jatuhTempo: '2026-09-05', status: 'Belum Lunas' },
        { id: 'HP-002', jenis: 'Hutang', pihak: 'Distributor Sparepart X', noRef: 'BUY-002', jumlah: 750000, jatuhTempo: '2026-09-10', status: 'Belum Lunas' }
      ]
    };

    // State Reactive Application
    window.state = {
      role: 'admin',
      activeTab: 'dashboard',
      darkMode: true,
      pelanggan: [],
      stok: [],
      servis: [],
      penjualan: [],
      pembelian: [],
      kas: [],
      operasional: [],
      hutangpiutang: [],
      cart: []
    };

    const getColRef = (colName) => collection(db, 'artifacts', appId, 'public', 'data', colName);
    const getDocRef = (colName, docId) => doc(db, 'artifacts', appId, 'public', 'data', colName, docId);

    // Initialize Firebase Realtime Sync
    async function initFirebaseSync() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        console.log("✅ Firebase authenticated successfully");
        updateDBStatus(true, "Firebase Connected");
        window.useLocalStorage = false;

        const collections = ['pelanggan', 'stok', 'servis', 'penjualan', 'pembelian', 'kas', 'operasional', 'hutangpiutang'];
        
        collections.forEach(colName => {
          const colRef = getColRef(colName);
          
          onSnapshot(colRef, async (snapshot) => {
            if (snapshot.empty && initialSeedData[colName]) {
              // Seed initial data if collection is completely empty
              for (const item of initialSeedData[colName]) {
                await setDoc(getDocRef(colName, item.id), item);
              }
            } else {
              const dataList = [];
              snapshot.forEach(docSnap => {
                dataList.push({ ...docSnap.data(), id: docSnap.id });
              });
              window.state[colName] = dataList;
              window.renderPage();
            }
          }, (err) => {
            if (!window.useLocalStorage) {
              console.log(`⚠️ Switching to LocalStorage for ${colName}`);
              window.useLocalStorage = true;
              updateDBStatus(false, "LocalStorage Mode");
              loadFromLocalStorage(colName);
            }
          });
        });

      } catch (err) {
        // Suppress Firebase error logging, just switch to LocalStorage silently
        window.useLocalStorage = true;
        updateDBStatus(false, "LocalStorage Mode (Offline)");
        showModeNotification();
        
        // Load seed data into localStorage and render
        const collections = ['pelanggan', 'stok', 'servis', 'penjualan', 'pembelian', 'kas', 'operasional', 'hutangpiutang'];
        collections.forEach(colName => {
          if (initialSeedData[colName]) {
            initialSeedData[colName].forEach(item => {
              saveToLocalStorage(colName, item.id, item);
            });
          }
          loadFromLocalStorage(colName);
        });
      }
    }

    // LocalStorage Fallback Functions
    function saveToLocalStorage(colName, docId, data) {
      const key = `joy-print-${colName}`;
      let store = JSON.parse(localStorage.getItem(key) || '{}');
      store[docId] = data;
      localStorage.setItem(key, JSON.stringify(store));
    }

    function loadFromLocalStorage(colName) {
      const key = `joy-print-${colName}`;
      const store = JSON.parse(localStorage.getItem(key) || '{}');
      window.state[colName] = Object.values(store);
      window.renderPage();
    }

    function loadAllFromLocalStorage() {
      const collections = ['pelanggan', 'stok', 'servis', 'penjualan', 'pembelian', 'kas', 'operasional', 'hutangpiutang'];
      collections.forEach(colName => {
        loadFromLocalStorage(colName);
      });
    }

    function deleteFromLocalStorage(colName, docId) {
      const key = `joy-print-${colName}`;
      let store = JSON.parse(localStorage.getItem(key) || '{}');
      delete store[docId];
      localStorage.setItem(key, JSON.stringify(store));
    }

    // Update Database Status Badge
    function updateDBStatus(isFirebase, message) {
      const statusBadge = document.getElementById('db-status');
      const statusDot = document.getElementById('db-status-dot');
      const statusText = document.getElementById('db-status-text');

      if (isFirebase) {
        statusBadge.className = 'px-4 py-1.5 mx-3 mb-2 rounded text-[11px] font-medium flex items-center justify-between bg-emerald-500/10 text-emerald-500 border border-emerald-500/20';
        statusDot.className = 'w-2 h-2 rounded-full bg-emerald-500 animate-pulse';
      } else {
        statusBadge.className = 'px-4 py-1.5 mx-3 mb-2 rounded text-[11px] font-medium flex items-center justify-between bg-amber-500/10 text-amber-500 border border-amber-500/20';
        statusDot.className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse';
      }
      statusText.textContent = message;
    }

    // Show friendly notification for mode change
    function showModeNotification() {
      const notification = document.createElement('div');
      notification.className = 'fixed top-4 right-4 bg-amber-50 dark:bg-amber-900/30 border border-amber-300 dark:border-amber-700 text-amber-800 dark:text-amber-200 px-4 py-3 rounded-lg shadow-lg z-40 max-w-sm';
      notification.innerHTML = `
        <div class="flex items-start space-x-2">
          <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
          <div>
            <p class="font-semibold text-sm">Mode Offline</p>
            <p class="text-xs mt-1">Data disimpan secara lokal di perangkat Anda.</p>
          </div>
        </div>
      `;
      document.body.appendChild(notification);
      lucide.createIcons();
      
      setTimeout(() => {
        notification.style.animation = 'fadeOut 0.3s ease-in-out';
        setTimeout(() => notification.remove(), 300);
      }, 4000);
    }

    // Database Sync Helper Functions for CRUD Operations
    window.dbSave = async function(colName, docId, data) {
      try {
        if (window.useLocalStorage) {
          saveToLocalStorage(colName, docId, data);
        } else {
          await setDoc(getDocRef(colName, docId), data);
        }
      } catch (err) {
        // Silently fallback to LocalStorage on error
        if (!window.useLocalStorage) {
          window.useLocalStorage = true;
          updateDBStatus(false, "LocalStorage Mode");
        }
        saveToLocalStorage(colName, docId, data);
      }
    };

    window.dbUpdate = async function(colName, docId, data) {
      try {
        if (window.useLocalStorage) {
          const key = `joy-print-${colName}`;
          let store = JSON.parse(localStorage.getItem(key) || '{}');
          store[docId] = { ...store[docId], ...data };
          localStorage.setItem(key, JSON.stringify(store));
          window.renderPage();
        } else {
          await updateDoc(getDocRef(colName, docId), data);
        }
      } catch (err) {
        // Silently fallback to LocalStorage on error
        if (!window.useLocalStorage) {
          window.useLocalStorage = true;
          updateDBStatus(false, "LocalStorage Mode");
        }
        const key = `joy-print-${colName}`;
        let store = JSON.parse(localStorage.getItem(key) || '{}');
        store[docId] = { ...store[docId], ...data };
        localStorage.setItem(key, JSON.stringify(store));
        window.renderPage();
      }
    };

    window.dbDelete = async function(colName, docId) {
      try {
        if (window.useLocalStorage) {
          deleteFromLocalStorage(colName, docId);
        } else {
          await deleteDoc(getDocRef(colName, docId));
        }
      } catch (err) {
        // Silently fallback to LocalStorage on error
        if (!window.useLocalStorage) {
          window.useLocalStorage = true;
          updateDBStatus(false, "LocalStorage Mode");
        }
        deleteFromLocalStorage(colName, docId);
      }
    };

    window.navItems = [
      { id: 'dashboard', label: 'Dashboard Utama', icon: 'layout-dashboard', roles: ['admin', 'user'] },
      { id: 'servis', label: 'Transaksi Servis', icon: 'wrench', roles: ['admin', 'user'] },

    window.formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);

    window.toggleDarkMode = function() {
      state.darkMode = !state.darkMode;
      const html = document.documentElement;
      if (state.darkMode) {
        html.classList.add('dark');
        document.getElementById('theme-label').innerText = 'Dark';
      } else {
        html.classList.remove('dark');
        document.getElementById('theme-label').innerText = 'Light';
      }
    };

    window.toggleSidebar = function() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('-translate-x-full');
    };

      openModal(`
        <div class="space-y-4">
          <h3 class="font-bold text-lg text-slate-800 dark:text-slate-100 flex items-center space-x-2">
            <i data-lucide="shield-alert" class="w-5 h-5 text-cyan-500"></i>
            <span>Ganti Hak Akses Pengguna</span>
          </h3>

    window.getFinancialMetrics = function() {
      const omsetPenjualan = state.penjualan.reduce((acc, curr) => acc + curr.total, 0);
      const omsetServis = state.servis.reduce((acc, curr) => acc + (curr.bayar || 0), 0);
      const totalOmset = omsetPenjualan + omsetServis;

      const hppPenjualan = state.penjualan.reduce((acc, curr) => acc + (curr.hppTotal || 0), 0);
      const hppSparepartServis = state.servis.reduce((acc, s) => {
        const hppItems = (s.spareparts || []).reduce((sum, sp) => {
          const itemMaster = state.stok.find(b => b.id === sp.id);
          return sum + ((itemMaster ? itemMaster.hpp : sp.harga * 0.7) * sp.qty);
        }, 0);
        return acc + hppItems;
      }, 0);
      const totalHPP = hppPenjualan + hppSparepartServis;

      const labaKotor = totalOmset - totalHPP;
      const totalOperasional = state.operasional.reduce((acc, curr) => acc + curr.jumlah, 0);
      const labaBersih = Math.max(0, labaKotor - totalOperasional);

      const pos70 = labaBersih * 0.70;
      const pos20 = labaBersih * 0.20;
      const pos10 = labaBersih * 0.10;

      return {
        totalOmset,
        labaKotor,
        totalOperasional,
        labaBersih,
        pos70,
        pos20,
        pos10
      };
    };

    window.simpanServisBaru = async function(e) {
      e.preventDefault();
      const pelangganId = document.getElementById('srv-pelanggan').value;
      const pel = state.pelanggan.find(p => p.id === pelangganId);
      const printer = document.getElementById('srv-printer').value;
      const keluhan = document.getElementById('srv-keluhan').value;
      const biayaJasa = parseFloat(document.getElementById('srv-jasa').value) || 0;
      const dp = parseFloat(document.getElementById('srv-dp').value) || 0;

      const newId = `SRV-2026-00${state.servis.length + 1}`;
      const totalBiaya = biayaJasa;
      const sisa = totalBiaya - dp;

      const newServis = {
        id: newId,
        tanggal: new Date().toISOString().split('T')[0],
        pelangganId,
        pelangganNama: pel ? pel.nama : 'Umum',
        printer,
        keluhan,

    window.addToCart = function(id) {
      const b = state.stok.find(item => item.id === id);
      if (!b || b.jumlah <= 0) {
        alert('Stok barang habis!');
        return;
      }
      const existing = state.cart.find(c => c.id === id);
      if (existing) {
        if (existing.qty < b.jumlah) {
          existing.qty += 1;
        } else {
          alert('Mencapai batas stok yang tersedia!');
        }
      } else {
        state.cart.push({ id: b.id, nama: b.nama, harga: b.harga, hpp: b.hpp, qty: 1 });
      }
      renderPage();
    };

    window.updateCartQty = function(idx, change) {
      const item = state.cart[idx];
      const stokItem = state.stok.find(b => b.id === item.id);
      item.qty += change;
      if (item.qty <= 0) {
        state.cart.splice(idx, 1);
      } else if (stokItem && item.qty > stokItem.jumlah) {
        item.qty = stokItem.jumlah;
        alert('Mencapai batas stok!');
      }
      renderPage();
    };

    window.prosesCheckoutPOS = async function() {
      const total = state.cart.reduce((sum, item) => sum + (item.harga * item.qty), 0);
      const hppTotal = state.cart.reduce((sum, item) => sum + (item.hpp * item.qty), 0);
      const trxId = `TRX-2026-00${state.penjualan.length + 1}`;

      const newPenjualan = {
        id: trxId,
        tanggal: new Date().toISOString().split('T')[0],
        pelangganNama: 'Umum / Cash',
        items: state.cart.map(i => ({ ...i, subtotal: i.harga * i.qty })),
        total,
        hppTotal,
        labaKotor: total - hppTotal,
        metode: 'Tunai'
      };

      // Reduce stock levels in Firestore
      for (const cartItem of state.cart) {
        const stokDoc = state.stok.find(s => s.id === cartItem.id);
        if (stokDoc) {
          const newQty = Math.max(0, stokDoc.jumlah - cartItem.qty);
          await dbUpdate('stok', cartItem.id, { jumlah: newQty });
        }
      }

      await dbSave('penjualan', trxId, newPenjualan);

      // Print POS Receipt
      cetakNotaPOS(newPenjualan);

      state.cart = [];
      renderPage();
    };
